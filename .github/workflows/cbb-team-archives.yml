name: Refresh CBB team archives
# Verified schedules/results are independent of player, metric, roster, and market feeds.
on:
  workflow_call:
    inputs:
      historical_backfill:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      historical_backfill:
        description: 'Use the existing explicit historical backfill path'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '19 4,16 * * *'
      timezone: America/New_York
    - cron: '11,41 5 * * *'
      timezone: America/New_York
    - cron: '11 17 * * *'
      timezone: America/New_York
    # Independent morning retries if an earlier scheduled trigger is delayed or missed.
    - cron: '19 6,7 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - scripts/run_cbb_pipeline.py
      - tests/test_cbb_pipeline.py
      - .github/workflows/cbb-collect-component.yml
      - .github/workflows/cbb-team-archives.yml
      - data/cbb/bootstrap/*.json.gz
permissions:
  contents: write
  actions: read
jobs:
  verified-results:
    if: ${{ !inputs.historical_backfill && (github.event_name != 'push' || !contains(toJSON(github.event.commits), 'data/cbb/bootstrap/')) }}
    uses: ./.github/workflows/cbb-collect-component.yml
    with:
      component: results
    secrets: inherit
  explicit-historical-backfill:
    if: inputs.historical_backfill || (github.event_name == 'push' && contains(toJSON(github.event.commits), 'data/cbb/bootstrap/'))
    uses: ./.github/workflows/cbb-historical-archives.yml
    with:
      historical_backfill: ${{ inputs.historical_backfill || false }}
    secrets: inherit
