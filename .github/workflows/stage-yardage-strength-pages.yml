name: Build yardage strength page staging
on:
  workflow_dispatch:
  push:
    branches: [research/four-unit-archive-2026]
    paths:
      - 'build_yardage15_rankings_page_staging.py'
      - '.github/workflows/stage-yardage-strength-pages.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u build_yardage15_rankings_page_staging.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/2026/yardage15_rankings_page_staging.*
          git diff --cached --quiet || git commit -m "Stage new Team, Offensive and Defensive strength display fields"
          git push
