name: Refresh FBS Season Leaders
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches: [main]
    paths:
      - build_fbs_leaders.py
      - leaderboard_core.py
      - test_fbs_leaders.py
      - .github/workflows/refresh-fbs-leaders.yml
permissions:
  contents: write
concurrency:
  group: fbs-leaders-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_fbs_leaders.py
      - name: Build completed-game FBS leaders
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_fbs_leaders.py --season 2026
      - name: Publish validated leaders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb-season-leaders.json college-football-season-leaders/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh FBS player season leaders"
          git pull --rebase -X theirs origin main
          git push
