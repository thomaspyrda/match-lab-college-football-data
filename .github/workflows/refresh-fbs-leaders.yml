name: Refresh FBS Season Leaders
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh CFB verified results']
    branches: [main]
    types: [completed]
  schedule:
    - cron: '13 4 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - build_fbs_leaders.py
      - leaderboard_core.py
      - test_fbs_leaders.py
      - .github/workflows/refresh-fbs-leaders.yml
permissions:
  contents: write
concurrency:
  group: fbs-leaders-production
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_fbs_leaders.py
      - name: Build completed-game FBS leaders
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_fbs_leaders.py --season 2026
      - name: Publish validated leaders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cfb-season-leaders.json college-football-season-leaders/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh FBS player season leaders"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Never auto-resolve competing changes to the same generated file.
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Unable to safely publish CFB outputs after five attempts" >&2
          exit 1

