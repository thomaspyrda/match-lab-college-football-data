name: Test isolated CFB component pipeline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/run_cfb_pipeline.py
      - scripts/check_cfb_workflows.py
      - scripts/verify_cfb_pipeline.py
      - tests/test_cfb_pipeline.py
      - .github/workflows/*cfb*.yml
      - .github/workflows/build-team-strength.yml
      - .github/workflows/coordinate-sport-data.yml
      - .github/workflows/deploy-pages.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebb7892f2300f67e174e4d57abeb9b18cdf4ee60
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .pipeline-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify workflow dependencies and publication boundaries
        run: python .pipeline-code/scripts/check_cfb_workflows.py
      - name: Verify preserved calculations and component failure isolation
        run: python -m unittest discover -s .pipeline-code/tests -p test_cfb_pipeline.py -v
