name: Refresh independent NBA availability
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nba_availability_source.py', '.github/workflows/refresh-nba-availability.yml']
  schedule:
    - cron: '30 15 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: nba-availability-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_nba_availability_source.py -v
      - run: python nba_availability_source.py
      - name: Publish availability observations only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba/pipeline/availability.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh independent NBA availability facts'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

