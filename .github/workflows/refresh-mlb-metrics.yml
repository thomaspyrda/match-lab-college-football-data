name: Refresh independent MLB team metrics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mlb_metric_source.py', '.github/workflows/refresh-mlb-metrics.yml']
  schedule:
    - cron: '40 3 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: mlb-team-metric-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_mlb_metric_source.py -v
      - run: python mlb_metric_source.py
      - name: Publish team metric facts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mlb/pipeline
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh independent MLB team metrics'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
