name: Publish CBB Tournament Results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_cbb_tournament_results.py
      - enrich_cbb_tournament_results.py
      - build_cbb_conference_tournament_results.py
      - .github/workflows/publish-cbb-tournament-results.yml
permissions:
  contents: write
concurrency:
  group: cbb-tournament-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative tournament results
        run: python build_cbb_tournament_results.py
      - name: Identify NCAA and NIT tournament outcomes
        run: python enrich_cbb_tournament_results.py
      - name: Identify conference tournament outcomes
        run: python build_cbb_conference_tournament_results.py
      - name: Validate archived coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('tournament-results','conference-tournament-results'):
              d=json.loads((Path('data/cbb')/(name+'.json')).read_text())
              assert isinstance(d['seasons'],dict)
              print(name,len(d['seasons']),'seasons')
          ncaa=json.loads(Path('data/cbb/tournament-results.json').read_text())
          duke=ncaa['seasons'].get('2026',{}).get('duke-blue-devils',{})
          assert duke.get('tournament')=='NCAA', '2026 Duke NCAA tournament classification not verified; do not publish placeholders as completed results'
          conf=json.loads(Path('data/cbb/conference-tournament-results.json').read_text())
          assert conf['seasons'], 'No sourced conference tournament outcomes available; publication incomplete'
          PY
      - name: Commit CBB tournament results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbb/tournament-results.json data/cbb/conference-tournament-results.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(cbb): publish historical postseason result archive'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
