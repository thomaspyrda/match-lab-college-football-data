name: MLB 2025 draft verified publication
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mlb-draft-2025-direct.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retrieve, normalize and audit 2025 draft
        run: |
          python - <<'PY'
          import json,urllib.request,datetime,pathlib,traceback
          directory=pathlib.Path('data/mlb');directory.mkdir(parents=True,exist_ok=True)
          status={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'year':2025,'status':'started'}
          slug={108:'los-angeles-angels',109:'arizona-diamondbacks',110:'baltimore-orioles',111:'boston-red-sox',112:'chicago-cubs',113:'cincinnati-reds',114:'cleveland-guardians',115:'colorado-rockies',116:'detroit-tigers',117:'houston-astros',118:'kansas-city-royals',119:'los-angeles-dodgers',120:'washington-nationals',121:'new-york-mets',133:'athletics',134:'pittsburgh-pirates',135:'san-diego-padres',136:'seattle-mariners',137:'san-francisco-giants',138:'st-louis-cardinals',139:'tampa-bay-rays',140:'texas-rangers',141:'toronto-blue-jays',142:'minnesota-twins',143:'philadelphia-phillies',144:'atlanta-braves',145:'chicago-white-sox',146:'miami-marlins',147:'new-york-yankees',158:'milwaukee-brewers'}
          try:
            url='https://statsapi.mlb.com/api/v1/draft/2025?limit=1500'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=90) as response:data=json.load(response)
            rounds=data['drafts']['rounds']
            output={name:[] for name in slug.values()}
            errors=[]
            seen=set()
            for rd in rounds:
              for pick in rd.get('picks',[]):
                if pick.get('isPass') is True:continue
                person=pick.get('person') or {}
                name=person.get('fullName') or pick.get('name')
                tid=(pick.get('team') or {}).get('id')
                num=pick.get('pickNumber')
                if not name or tid not in slug or num is None:
                  errors.append({'overall':num,'name':name,'team':tid,'round':rd.get('round')});continue
                num=int(num)
                if num in seen:raise ValueError('Duplicate overall pick: '+str(num))
                seen.add(num)
                pos=pick.get('position') or person.get('primaryPosition') or {}
                school=pick.get('school') or {}
                output[slug[tid]].append({'round':str(pick.get('pickRound') or rd.get('round')),'overall_pick':num,'round_pick':pick.get('roundPickNumber'),'player':name,'position':pos.get('abbreviation') if isinstance(pos,dict) else pos,'school':school.get('name') if isinstance(school,dict) else school,'player_id':person.get('id'),'signed':pick.get('isSigned') if isinstance(pick.get('isSigned'),bool) else None})
            for group in output.values():group.sort(key=lambda p:p['overall_pick'])
            count=sum(map(len,output.values()))
            status.update({'groups':len(rounds),'valid_picks':count,'unresolved':errors[:20],'unresolved_count':len(errors),'team_counts':{k:len(v) for k,v in output.items()}})
            if count<580 or any(not arr for arr in output.values()) or errors:
              raise ValueError('Draft validation incomplete; diagnostics retained')
            path=directory/'draft-classes.json'
            existing=json.loads(path.read_text()) if path.exists() and path.stat().st_size else {}
            years=existing.get('years') or {}
            years['2025']=output
            document={'schema_version':1,'generated_at':status['at'],'source':'MLB Official Stats API','source_url':url,'years':years}
            path.write_text(json.dumps(document,ensure_ascii=False,separators=(',',':'))+'\n')
            status['status']='published'
          except Exception as exc:
            status['status']='failed';status['error']=repr(exc);status['traceback']=traceback.format_exc()[-1500:]
          (directory/'draft-2025-direct-status.json').write_text(json.dumps(status,indent=2)+'\n')
          print(json.dumps({k:v for k,v in status.items() if k!='team_counts'},indent=2))
          PY
      - name: Commit source data or detailed diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/draft-2025-direct-status.json data/mlb/draft-classes.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(mlb): publish official 2025 draft or actionable diagnostic'
          git pull --rebase -X theirs origin main
          git push origin main
