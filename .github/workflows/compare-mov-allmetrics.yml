name: Compare separate vs all-metric MOV
on:
  push:
    branches: [main]
    paths: [run_compare_mov_allmetrics.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_compare_mov_allmetrics.py
      - name: Commit results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/compare_mov_separate_vs_allmetrics_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): compare game-level MOV integration'
          git pull --rebase origin main
          git push origin HEAD:main
