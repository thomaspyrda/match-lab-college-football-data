          from pathlib import Path
          for year in range(2015,2026):
              for prefix in ('historical-stage','historical-reconciliation'):
                  path=Path(f'mlb/data/{prefix}-{year}.json')
                  if not path.is_file(): raise SystemExit(f'Missing validated artifact: {path}')
          PY
      - name: Assemble audited archive with zero live page writes
        run: python combine_mlb_historical_staging.py
      - name: Simulate updates to all thirty existing MLB pages
        run: python dry_run_mlb_page_updates.py --archive mlb/data/historical-combined-preview.json --out mlb/data/historical-page-dry-run-report.json
      - name: Verify rendered HTML payload structure remains intact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dry_run_mlb_page_updates import transform, PATTERN
          archive=json.loads(Path('mlb/data/historical-combined-preview.json').read_text())
          pages=sorted(Path('mlb/teams').glob('*/index.html'))
          assert len(pages)==30
          total=0
          for page in pages:
              before=page.read_text()
              after,report=transform(before,archive,page.parent.name)
              source=PATTERN.search(before)
              updated=PATTERN.search(after)
              assert source and updated
              assert before[:source.start()]==after[:updated.start()], page
              assert before[source.end():]==after[updated.end():], page
              seed=json.loads(source.group(2))
              result=json.loads(updated.group(2))
              assert seed['team_id']==result['team_id'], page
              assert [v['key'] for v in seed['seasons']]==[v['key'] for v in result['seasons']], page
              for old,new in zip(seed['seasons'],result['seasons']):
                  for key,value in old.items():
                      if key not in ('games','game_data_coverage'):
                          assert new.get(key)==value, (page,key)
              total+=report['added_regular_games']
          assert total==50386, total
          print(f'Validated {len(pages)} HTML payloads, {total} team-game entries, without modifying files')
          PY
      - name: Enforce audited page readiness for historical seasons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('mlb/data/historical-page-dry-run-report.json').read_text())
          assert report['teams']==30, 'Expected 30 MLB team pages'
          assert report['regular_games_added']>25000, 'Historical regular season data missing'
          assert report['publication_ready'] is True, report['coverage_gate']
          assert report['coverage_gate']=='PASS_STANDINGS_AND_STRUCTURE'
          print('Historical publication readiness gate passed; no live files changed')
          PY
      - name: Build three isolated HTML render previews
        run: python build_mlb_render_previews.py
      - name: Set up Chromium for isolated browser test
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify season selector and game expansion in Chromium
        run: python test_mlb_browser_previews.py
      - name: Upload isolated browser-preview files
        uses: actions/upload-artifact@v4
        with:
          name: mlb-browser-render-previews
          path: mlb/data/html-preview/
          retention-days: 14
      - name: Generate review-only historical page package
        run: python build_mlb_publication_review.py
      - name: Verify all thirty review files and source checksums
        run: python verify_mlb_publication_review.py
      - name: Snapshot all thirty existing pages for offline rollback review
        run: python prepare_mlb_rollback_snapshot.py
      - name: Independently verify thirty rollback snapshots
        run: python verify_mlb_rollback_snapshot.py
      - name: Fail closed if source pages changed since review
        run: python check_mlb_predeployment_drift.py
      - name: Save review-only pages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: mlb-publication-review-no-deployment
          path: mlb/data/publication-review/
          retention-days: 14
      - name: Upload consolidated archive and page audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-consolidation-audit
          path: |
            mlb/data/historical-combined-preview.json
            mlb/data/historical-page-dry-run-report.json
          retention-days: 14
