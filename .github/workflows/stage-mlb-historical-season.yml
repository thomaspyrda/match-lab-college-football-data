        run: exit 1

  consolidate-historical-archive:
    if: github.event_name == 'push'
    needs: [historical-stage, historical-2015-smoke, historical-2016-smoke, historical-2017-smoke, historical-2018-smoke, historical-2019-smoke, historical-2021-smoke, historical-2022-smoke, historical-2023-smoke, historical-2024-smoke, historical-2025-smoke]
