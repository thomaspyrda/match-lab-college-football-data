name: Stage MLB Historical Season
on:
  push:
    branches: [main]
    paths:
      - stage_mlb_historical_season.py
      - tests/test_stage_mlb_historical_season.py
      - reconcile_mlb_historical_standings.py
      - tests/test_reconcile_mlb_historical_standings.py
      - .github/workflows/stage-mlb-historical-season.yml
  workflow_dispatch:
    inputs:
      year:
        description: "MLB season to stage (2015-2026)"
        required: true
        type: choice
        options:
          - '2026'
          - '2025'
          - '2024'
          - '2023'
          - '2022'
          - '2021'
          - '2020'
          - '2019'
          - '2018'
          - '2017'
          - '2016'
          - '2015'
permissions:
  contents: read
jobs:
  historical-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical retrieval unit tests
        run: |
          python -m unittest discover -s tests -p test_stage_mlb_historical_season.py -v
          python -m unittest discover -s tests -p test_reconcile_mlb_historical_standings.py -v
      - name: Audit 30-team crosswalk
        run: python audit_mlb_team_crosswalk.py
      - name: Stage selected historical season with no publication
        env:
          STAGE_YEAR: ${{ inputs.year || '2020' }}
        run: python stage_mlb_historical_season.py --year "$STAGE_YEAR"
      - name: Reconcile 2020 official season wins and losses
        if: github.event_name == 'push'
        id: reconcile
        continue-on-error: true
        run: python reconcile_mlb_historical_standings.py --year 2020
      - name: Store historical season results as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-stage-${{ inputs.year || '2020' }}
          path: |
            mlb/data/historical-stage-${{ inputs.year || '2020' }}.json
            mlb/data/historical-reconciliation-2020.json
          retention-days: 14
      - name: Enforce 2020 standings reconciliation
        if: steps.reconcile.outcome == 'failure'
        run: exit 1

  historical-2015-smoke:
