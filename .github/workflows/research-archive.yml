name: Research Archive 2026 (isolated)
on:
  workflow_dispatch:
  push:
    branches: [research/four-unit-archive-2026]
    paths:
      - 'build_research_archive.py'
      - 'run_four_unit_research.py'
      - 'build_conference_strength_research.py'
      - 'compare_earned_exposure.py'
      - 'compare_raw_metrics_earned.py'
      - '.github/workflows/research-archive.yml'
permissions:
  contents: write
jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive code
        run: python -m py_compile build_research_archive.py
      - name: Build weekly historical research archive
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          RESEARCH_SEASON: '2026'
        run: python build_research_archive.py
      - name: Calculate all national ranking variants
        run: python run_four_unit_research.py
      - name: Build conference research rankings
        run: python build_conference_strength_research.py
      - name: Compare earned pregame exposure
        run: python compare_earned_exposure.py
      - name: Compare unadjusted metrics plus earned competition
        run: python compare_raw_metrics_earned.py
      - name: Verify output files and coverage
        run: |
          python - <<'PY'
          import json,pathlib,csv
          root=pathlib.Path('data/research/2026')
          report=json.loads((root/'coverage.json').read_text())
          rows=list(csv.DictReader((root/'weekly_team_metrics.csv').open()))
          assert report['team_game_rows']==len(rows)>0
          assert report['metrics_per_side']==41
          assert (root/'top25_comparison.csv').exists()
          assert (root/'ranking_experiments.json').exists()
          assert (root/'conference_strength.csv').exists()
          assert (root/'conference_exposure.csv').exists()
          assert (root/'pregame_opponent_exposure.csv').exists()
          assert (root/'pregame_exposure_summary.csv').exists()
          assert (root/'exposure_gated_comparison.csv').exists()
          assert (root/'raw_metrics_earned_exposure_comparison.csv').exists()
          assert len(set(x['team'] for x in rows))>=100
          print('Validated',len(rows),'team-game rows')
          PY
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-research-2026
          path: data/research/2026/
      - name: Commit archive on research branch only
        if: github.ref == 'refs/heads/research/four-unit-archive-2026'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/2026
          git diff --cached --quiet || git commit -m "Update isolated CFB research archive"
          git push
