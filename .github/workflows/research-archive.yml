name: Research Archive 2026 (isolated)
on:
  workflow_dispatch:
  push:
    branches: [research/four-unit-archive-2026]
    paths:
      - 'build_research_archive.py'
      - 'run_four_unit_research.py'
      - 'build_conference_strength_research.py'
      - 'compare_earned_exposure.py'
      - 'compare_raw_metrics_earned.py'
      - 'audit_key_game_results.py'
      - 'test_season_aggregate_sos.py'
      - 'test_pure_rush_sos.py'
      - 'test_pure_units_sos.py'
      - 'test_pure_units_20plus_sos.py'
      - 'test_pure_units_top50_win_only.py'
      - 'test_pure_units_top30_win_only.py'
      - 'test_pure_units_earned_vs_losses.py'
      - 'test_pure_units_game_quality_adjusted.py'
      - 'test_pure_units_expected_residual.py'
      - 'test_pure_units_top50_stat_cap.py'
      - 'test_market_spread_power.py'
      - 'test_market_no_preseason.py'
      - 'test_betwise_dominance_weights.py'
      - 'test_betwise_dominance_market_baseline.py'
      - 'test_betwise_unit_matched.py'
      - 'test_betwise_2025_coefficients_on_2026.py'
      - 'test_betwise_20_45_20_15.py'
      - 'test_betwise_strict_rank70_cutoff.py'
      - 'backtest_betwise_2025.py'
      - '.github/workflows/research-archive.yml'
permissions:
  contents: write
jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive code
        run: python -m py_compile build_research_archive.py
      - name: Build weekly historical research archive
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          RESEARCH_SEASON: '2026'
        run: |
          python build_research_archive.py
          python test_market_spread_power.py
          python test_market_no_preseason.py
          RESEARCH_SEASON=2025 python build_research_archive.py
          python backtest_betwise_2025.py
      - name: Calculate all national ranking variants
        run: python run_four_unit_research.py
      - name: Build conference research rankings
        run: python build_conference_strength_research.py
      - name: Compare earned pregame exposure
        run: python compare_earned_exposure.py
      - name: Compare unadjusted metrics plus earned competition
        run: python compare_raw_metrics_earned.py
      - name: Audit key results without changing rankings
        run: python audit_key_game_results.py
      - name: Test season averaged units with single SOS factor
        run: python test_season_aggregate_sos.py
      - name: Compare seven-metric pure rushing units
        run: python test_pure_rush_sos.py
      - name: Compare pure passing and rushing units
        run: python test_pure_units_sos.py
      - name: Compare pass 20-plus-yard rate definition
        run: python test_pure_units_20plus_sos.py
      - name: Test no positive QoR beyond pregame Top 50 without caps
        run: python test_pure_units_top50_win_only.py
      - name: Test Top 30 win-credit cutoff
        run: python test_pure_units_top30_win_only.py
      - name: Compare earned wins and universal loss penalties
        run: python test_pure_units_earned_vs_losses.py
      - name: Test per-game quality-adjusted four-unit dominance
        run: python test_pure_units_game_quality_adjusted.py
      - name: Test actual minus expected unit residuals
        run: python test_pure_units_expected_residual.py
      - name: Test strict Top 50 statistical evidence cutoff
        run: python test_pure_units_top50_stat_cap.py
      - name: Compare BetWise dominance weight mixes
        run: python test_betwise_dominance_weights.py
      - name: Test baseline anchored dominance mixes
        run: python test_betwise_dominance_market_baseline.py
      - name: Empirically fit opposing statistical unit adjustments
        run: python test_betwise_unit_matched.py
      - name: Compare 2025 coefficients on 2026 games
        run: python test_betwise_2025_coefficients_on_2026.py
      - name: Compare strengthened competition weights
        run: python test_betwise_20_45_20_15.py
      - name: Test strict opponent rank 70 eligibility cutoff
        run: python test_betwise_strict_rank70_cutoff.py
      - name: Verify output files and coverage
        run: |
          python - <<'PY'
          import json,pathlib,csv
          root=pathlib.Path('data/research/2026')
          report=json.loads((root/'coverage.json').read_text())
          rows=list(csv.DictReader((root/'weekly_team_metrics.csv').open()))
          assert report['team_game_rows']==len(rows)>0
          assert report['metrics_per_side']==41
          assert pathlib.Path('data/research/2025/betwise_unit_matched_2025_backtest.json').exists()
          assert (root/'top25_comparison.csv').exists()
          assert (root/'ranking_experiments.json').exists()
          assert (root/'conference_strength.csv').exists()
          assert (root/'conference_exposure.csv').exists()
          assert (root/'pregame_opponent_exposure.csv').exists()
          assert (root/'pregame_exposure_summary.csv').exists()
          assert (root/'exposure_gated_comparison.csv').exists()
          assert (root/'raw_metrics_earned_exposure_comparison.csv').exists()
          assert (root/'key_game_results_audit.csv').exists()
          assert (root/'elite_validation_games.csv').exists()
          assert (root/'pregame_all_team_ranks.csv').exists()
          assert (root/'season_aggregate_sos_comparison.csv').exists()
          assert (root/'pure_rush_sos_comparison.csv').exists()
          assert (root/'pure_units_sos_comparison.csv').exists()
          assert (root/'pure_units_20plus_sos_comparison.csv').exists()
          assert (root/'pure_units_top50_win_only_comparison.csv').exists()
          assert (root/'pure_units_top30_win_only_comparison.csv').exists()
          assert (root/'pure_units_earned_vs_losses_comparison.csv').exists()
          assert (root/'pure_units_game_quality_adjusted_comparison.csv').exists()
          assert (root/'pure_units_expected_residual_comparison.csv').exists()
          assert (root/'pure_units_top50_stat_cap_comparison.csv').exists()
          assert (root/'pure_units_top50_stat_cap_audit.json').exists()
          assert (root/'pure_units_expected_residual_audit.json').exists()
          assert len(set(x['team'] for x in rows))>=100
          print('Validated',len(rows),'team-game rows')
          PY
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-research-2026
          path: |
            data/research/2025/
            data/research/2026/
      - name: Commit archive on research branch only
        if: github.ref == 'refs/heads/research/four-unit-archive-2026'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/2025 data/research/2026
          git diff --cached --quiet || git commit -m "Update isolated CFB research archive"
          git push
