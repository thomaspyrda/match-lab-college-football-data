name: NBA historical team data
on:
  push:
    paths:
      - 'nba/pipeline/build_history.py'
  workflow_dispatch:
    inputs:
      from_season:
        description: First season ending year
        required: true
        default: '2016'
      through_season:
        description: Last season ending year
        required: true
        default: '2026'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install nba_api pandas requests
      - run: python nba/pipeline/build_history.py --from-season ${{ inputs.from_season }} --through-season ${{ inputs.through_season }}
      - name: Publish validated generated JSON
        run: |
          git config user.name "betwise-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/teams/data/
          if ! git diff --cached --quiet; then git commit -m "Populate verified NBA team-season history"; git push; fi
