name: Refresh CFB play mix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - refresh_cfb_play_rates.py
      - .github/workflows/refresh-cfb-play-mix.yml
permissions:
  contents: write
concurrency:
  group: cfb-play-mix
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check script and UI syntax
        run: |
          python -m py_compile refresh_cfb_play_rates.py
          node --check cfb-dashboard-preview/app.js
      - name: Populate verified offensive and defensive play-mix rates
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python refresh_cfb_play_rates.py
      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb-dashboard-preview/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "Populate CFB rushing and passing play-mix rates"
          git pull --rebase origin main
          git push origin main
