name: Refresh MLB season snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - finalize_mlb_season.py
      - build_mlb_season_snapshots.py
      - backfill_mlb_team_metrics.py
      - build_mlb_team_rankings.py
      - build_mlb_season_leaders.py
      - tests/test_mlb_season_leaders.py
      - tests/test_mlb_team_rankings.py
      - .github/workflows/mlb-season-snapshots.yml
permissions:
  contents: write
concurrency:
  group: mlb-snapshot-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture historical snapshot before refresh
        run: git show HEAD:data/mlb/season-snapshots.json > /tmp/mlb-season-snapshots-before.json
      - name: Collect MLB game results and validate seasons
        run: python build_mlb_season_snapshots.py --years "$(date -u +%Y)"
      - name: Add missing official team metrics
        run: python backfill_mlb_team_metrics.py
      - name: Validate output and preserve historical seasons
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          before=json.loads(Path("/tmp/mlb-season-snapshots-before.json").read_text())
          after=json.loads(Path("data/mlb/season-snapshots.json").read_text())
          current_year=datetime.now(timezone.utc).year
          assert all(len(teams)==30 for teams in after["seasons"].values())
          assert all(row["ats_record"] is None and row["ou_record"] is None for teams in after["seasons"].values() for row in teams.values())
          metric_keys=("batting_average","on_base_percentage","slugging_percentage","home_runs","strikeout_rate","era","whip","opponent_average","bullpen_era","strikeouts_per_9")
          additive_keys={"team_stats","team_stats_source","team_stats_updated_at"}
          for year,rows in before["seasons"].items():
              if int(year)<current_year:
                  for slug,row in rows.items():
                      refreshed=after["seasons"][year][slug]
                      assert {k:v for k,v in refreshed.items() if k not in additive_keys}=={k:v for k,v in row.items() if k not in additive_keys}, f"Archived game/record data changed: {year} {slug}"
                      for key,value in row.get("team_stats",{}).items():
                          if value is not None:
                              assert refreshed.get("team_stats",{}).get(key)==value, f"Existing metric changed: {year} {slug} {key}"
          for year,teams in after["seasons"].items():
              if int(year)<current_year:
                  assert all(all(row.get("team_stats",{}).get(key) is not None for key in metric_keys) for row in teams.values()), f"Missing team metrics in completed season {year}"
          print(len(after["seasons"]), "seasons validated; historical schedule/results preserved and team metrics populated")
          PY
      - name: Finalize completed MLB seasons and playoff results
        run: python finalize_mlb_season.py
      - name: Build and validate MLB ranking pages data
        run: |
          python -m unittest discover -s tests -p test_mlb_team_rankings.py
          python -m unittest discover -s tests -p test_mlb_final_season.py
          python build_mlb_team_rankings.py
      - name: Refresh MLB regular-season player leaders
        run: |
          python -m unittest discover -s tests -p test_mlb_season_leaders.py
          python build_mlb_season_leaders.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/season-playoff-results.json data/mlb/season-snapshots.json mlb/rankings/data/mlb-team-rankings.json mlb/season-leaders/data
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): update verified season snapshots"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
