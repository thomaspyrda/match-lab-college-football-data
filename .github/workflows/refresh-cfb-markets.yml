name: Refresh CFB live markets
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 4,16 * * *'
      timezone: America/New_York
    - cron: '7,27,47 9-23 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-cfb-markets.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/cfb-collect-component.yml
    with:
      component: markets
    secrets: inherit
