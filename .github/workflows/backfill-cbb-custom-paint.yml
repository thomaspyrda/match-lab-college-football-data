name: Backfill CBB linked custom paint archives
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backfill_cbb_custom_paint.py
      - .github/workflows/backfill-cbb-custom-paint.yml
permissions:
  contents: write
concurrency:
  group: cbb-custom-paint
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Extract verified official whole-game paint records
        run: python -u backfill_cbb_custom_paint.py --shard ${{ matrix.shard }} --shards 6 --workers 5 --output /tmp/official-paint-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-paint-shard-${{ matrix.shard }}
          path: /tmp/official-paint-shard-${{ matrix.shard }}.json
  publish:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: custom-paint-shard-*
          path: /tmp/official-paint-shards
      - name: Verify coverage, merge sources and validate history
        run: |
          cp data/cbb/official-paint-backfill-report.json data/cbb/official-paint-pre-custom-report.json
          python backfill_cbb_official_paint.py --merge --shards 6 --input-dir /tmp/official-paint-shards
          python audit_cbb_paint_coverage.py
          python validate_cbb_history.py
      - name: Publish verified records and coverage report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbb/paint-coverage-report.json data/cbb/official-paint-pre-custom-report.json data/cbb/official-paint-observations.json data/cbb/official-paint-backfill-report.json data/cbb/opponent-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(cbb): extend paint coverage with official linked custom StatCrew archives'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
