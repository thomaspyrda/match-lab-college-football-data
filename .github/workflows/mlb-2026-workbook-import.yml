name: Publish 2026 MLB workbook odds
on:
  push:
    paths: ['.github/workflows/mlb-2026-workbook-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Import odds and pitchers
        run: |
          mkdir -p data/mlb/audits
          python scripts/import_2026_mlb_odds.py 2>&1 | tee data/mlb/audits/2026-workbook-import.txt
      - name: Commit enriched season
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/game-results/2026.json data/mlb/audits/2026-workbook-import.txt
          git commit -m "Publish 2026 MLB season-specific odds and starting pitchers"
          git push
      - name: Save diagnostics if failed
        if: failure()
        run: |
          mkdir -p data/mlb/audits
          if [ ! -f data/mlb/audits/2026-workbook-import.txt ]; then echo 'Import failed before executing script' > data/mlb/audits/2026-workbook-import.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/audits/2026-workbook-import.txt
          git commit -m "Record 2026 workbook importer failure" && git push || true
