name: Build Match Lab production
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 0"
  push:
    branches:
      - main
    paths:
      - refresh_match_lab.py
      - build_seo_pages.py
      - build_sport_team_pages.py
      - build_advanced_profiles.py
      - promote_v15_live.py
      - experiment_dominance_v15.py
      - data/weekly/**
      - data/preseason/**
      - site-navigation.js
      - site-navigation.css
      - styles.css
      - app.js
      - .github/workflows/refresh-match-lab.yml
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh source data
        run: python refresh_match_lab.py
      - name: Rebuild frozen v15 through completed games
        run: |
          MODEL_WEEK=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/current_rankings.json").read_text())
          print(int(d["week"]))
          PY
          )
          MODEL_WEEK="$MODEL_WEEK" python experiment_dominance_v15.py
      - name: Promote frozen v15 to live rankings
        run: python promote_v15_live.py
      - name: Generate production pages
        run: python build_seo_pages.py
      - name: Verify frozen v15 is production source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/current_rankings.json").read_text())
          assert d.get("model",{}).get("version")=="v15", d.get("model")
          assert d.get("model",{}).get("status")=="production_frozen", d.get("model")
          teams=d.get("teams",[])
          assert len(teams)>=130, len(teams)
          v15_rows=[t for t in teams if t.get("unit_strength_model")=="validated_v15_recursive_dominance"]
          assert len(v15_rows)>=130, f"only {len(v15_rows)} v15 rows found"
          assert any(t.get("team_strength_sd") is not None for t in v15_rows), "v15 SD output missing"
          print(f"Verified frozen v15 production board: {len(v15_rows)} v15 teams, Week {d.get('week')}")
          PY
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Match Lab production output"
          git pull --rebase -X theirs origin main
          git push
