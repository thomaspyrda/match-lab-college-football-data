name: Build CFB team history
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supplement_cfb_2015_defense.py
      - cfb_team_sections.py
      - refresh_cfb_team_details.py
      - build_cfb_team_pages.py
      - scripts/refresh_cfb_directory_records.py
      - verify_cfb_team_pages.py
      - test_cfb_team_pages.py
      - cfb/team-page.js
      - cfb/team-page.css
      - data/cfb/team-registry.json
      - data/historical/**
      - .github/workflows/build-cfb-team-pages.yml
  workflow_run:
    workflows: ['Refresh CFB verified results', 'Refresh CFB team metrics', 'Refresh CFB player statistics', 'Refresh CFB live markets', 'Refresh CFB team metadata', Build Team Strength]
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: cfb-team-history
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate team history calculations
        run: python -m unittest test_cfb_team_pages.py
      - name: Check initial component readiness
        id: ready
        run: |
          ready=true
          for component in results metrics players; do
            if [ ! -f "data/cfb/pipeline/$component.json" ]; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Assemble active-season team inputs from independent verified components
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/run_cfb_pipeline.py team-pages --store data/cfb/pipeline
      - name: Build all CFB team pages
        if: steps.ready.outputs.ready == 'true'
        run: python build_cfb_team_pages.py
      - name: Sync CFB directory records with completed 2026 games
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/refresh_cfb_directory_records.py
      - name: Verify every populated team-season
        if: steps.ready.outputs.ready == 'true'
        run: python verify_cfb_team_pages.py
      - name: Publish generated team archives
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/teams data/cfb/teams data/cfb/details teams.html sitemap-cfb-teams.xml sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Build CFB regular-season team archives"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Never auto-resolve competing changes to the same generated file.
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Unable to safely publish CFB outputs after five attempts" >&2
          exit 1

