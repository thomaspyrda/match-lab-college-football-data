name: Build CFB team history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_cfb_team_pages.py
      - test_cfb_team_pages.py
      - cfb/team-page.js
      - cfb/team-page.css
      - data/cfb/team-registry.json
      - data/historical/**
      - .github/workflows/build-cfb-team-pages.yml
  workflow_run:
    workflows: [Build Match Lab production]
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: cfb-team-history
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate team history calculations
        run: python -m unittest test_cfb_team_pages.py
      - name: Build all CFB team pages
        run: python build_cfb_team_pages.py
      - name: Publish generated team archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/teams data/cfb/teams teams.html sitemap-cfb-teams.xml sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Build CFB regular-season team archives"
          git pull --rebase origin main
          git push origin main
