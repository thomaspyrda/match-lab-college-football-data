name: Stage MLB Daily Backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '55 10 * * *'
  push:
    branches: [main]
    paths:
      - stage_mlb_daily_backfill.py
      - stage_mlb_historical_season.py
      - tests/test_stage_mlb_historical_season.py
      - audit_mlb_team_crosswalk.py
      - merge_mlb_daily_backfill.py
      - preview_mlb_team_page_backfill.py
      - dry_run_mlb_page_updates.py
      - tests/test_dry_run_mlb_page_updates.py
      - tests/test_merge_mlb_daily_backfill.py
      - tests/test_stage_mlb_daily_backfill.py
      - .github/workflows/stage-mlb-daily-backfill.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter with test fixtures
        run: |
          python -m unittest discover -s tests -p test_stage_mlb_daily_backfill.py -v
          python -m unittest discover -s tests -p test_stage_mlb_historical_season.py -v
          python -m unittest discover -s tests -p test_merge_mlb_daily_backfill.py -v
          python -m unittest discover -s tests -p test_dry_run_mlb_page_updates.py -v
      - name: Verify MLB-to-ESPN identities for all 30 teams
        run: python audit_mlb_team_crosswalk.py
      - name: Stage recent MLB final games and player box scores
        run: python stage_mlb_daily_backfill.py --lookback-days 3
      - name: Validate nonpublishing game archive merge
        run: python merge_mlb_daily_backfill.py
      - name: Validate adapter against all MLB team pages
        run: python preview_mlb_team_page_backfill.py
      - name: Dry-run MLB page updates without publishing
        run: python dry_run_mlb_page_updates.py
      - name: Store audit report
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-backfill-preview
          path: |
            mlb/data/daily-backfill-preview.json
            mlb/data/mlb-team-identity-audit.json
            mlb/data/internal-backfill-archive-preview.json
            mlb/data/team-page-adapter-preview.json
            mlb/data/team-page-dry-run-report.json
          retention-days: 14
