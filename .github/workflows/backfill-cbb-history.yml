name: Backfill CBB historical tournament results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backfill_cbb_tournament_history.py
      - backfill_cbb_opponent_metrics.py
      - backfill_cbb_markets.py
      - backfill_cbb_program_accolades.py
      - .github/workflows/backfill-cbb-history.yml
permissions:
  contents: write
concurrency:
  group: cbb-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download historical game and bracket sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/cbb-sources
          for file in MTeams MConferenceTourneyGames MSecondaryTourneyCompactResults MNCAATourneyCompactResults MNCAATourneySeeds MTeamConferences MRegularSeasonCompactResults MRegularSeasonDetailedResults MNCAATourneySlots; do
            curl --fail --retry 3 -L "https://media.githubusercontent.com/media/KernelMcGregor/2026MMMLM/main/Data/$file.csv" -o "/tmp/cbb-sources/$file.csv"
          done
          curl --fail --retry 3 -L 'https://s3.amazonaws.com/fs.ncaa.org/Docs/stats/m_basketball_RB/Awards.pdf' -o /tmp/cbb-sources/Awards.pdf
          curl --fail --retry 3 -L 'https://s3.amazonaws.com/fs.ncaa.org/Docs/stats/m_final4/MFFBook.pdf' -o /tmp/cbb-sources/MFFBook.pdf
          pdftotext -raw /tmp/cbb-sources/Awards.pdf /tmp/cbb-sources/Awards-raw.txt
          pdftotext -layout /tmp/cbb-sources/Awards.pdf /tmp/cbb-sources/Awards.txt
          pdftotext -layout /tmp/cbb-sources/MFFBook.pdf /tmp/cbb-sources/MFFBook.txt
          for year in $(seq 2016 2026); do
            prior=$((year - 1))
            curl --fail --retry 3 -L "https://www.covers.com/sport/basketball/ncaab/statistics/team-betting/$prior-$year" -o "/tmp/cbb-sources/covers$year.html"
          done
          for kind in spreads totals; do
            curl --fail --retry 3 -L "https://raw.githubusercontent.com/JDSB123/ncaam-historical-data/main/canonicalized/odds/$kind/fg/${kind}_fg_canonical.csv" -o "/tmp/cbb-sources/$kind-canonical.csv"
          done
      - name: Finalize tournaments through 2026 and refresh program honors
        run: |
          python backfill_cbb_tournament_history.py --source-dir /tmp/cbb-sources --fetch-2026
          python backfill_cbb_opponent_metrics.py --source-dir /tmp/cbb-sources
          python backfill_cbb_markets.py --source-dir /tmp/cbb-sources
          python backfill_cbb_program_accolades.py --source-dir /tmp/cbb-sources
          python validate_cbb_history.py
      - name: Publish verified history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbb
          git diff --cached --quiet && exit 0
          git commit -m 'data(cbb): finalize tournaments and refresh program honors through 2026'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

