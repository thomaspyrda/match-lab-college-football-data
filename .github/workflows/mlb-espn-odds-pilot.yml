name: Verify historical 2026 MLB odds from ESPN
on:
  push:
    paths:
      - '.github/workflows/mlb-espn-odds-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch documented ESPN historical odds endpoints
        run: |
          mkdir -p data/mlb/audits
          python - <<'PY' | tee data/mlb/audits/espn-historical-odds-pilot.txt
          import json,urllib.request,urllib.error
          for date in ('20260820','20260919'):
              u='https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates='+date+'&limit=50'
              print('DATE',date,flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:d=json.load(r)
              except Exception as e:
                  print('SCOREBOARD_FAILED',type(e).__name__,str(e)[:150],flush=True);continue
              events=d.get('events',[])
              print('EVENTS',len(events),flush=True)
              for event in events[:6]:
                  eid=event['id']
                  odds=event.get('competitions',[{}])[0].get('odds',[])
                  print('EVENT',eid,'SCOREBOARD_ODDS',json.dumps(odds)[:400],flush=True)
                  url=f'https://sports.core.api.espn.com/v2/sports/baseball/leagues/mlb/events/{eid}/competitions/{eid}/odds'
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:core=json.load(r)
                      print('CORE_ODDS',eid,'count',core.get('count'),'first_ref',str(core.get('items',[])[:1])[:550],flush=True)
                  except Exception as e:
                      print('CORE_FAILED',eid,type(e).__name__,str(e)[:100],flush=True)
          PY
      - name: Commit ESPN pilot evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/audits/espn-historical-odds-pilot.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record ESPN historical 2026 MLB odds endpoint pilot"
            git push
          fi
