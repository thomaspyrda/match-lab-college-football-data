name: Stage MLB 2025 League Player Leaders
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - select_mlb_player_leaders.py
      - tests/test_select_mlb_player_leaders.py
      - .github/workflows/stage-mlb-league-player-stats.yml
permissions:
  contents: read
jobs:
  league-player-leaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused leader-selection tests
        run: python -m unittest discover -s tests -p test_select_mlb_player_leaders.py -v
      - name: Audit MLB team identities
        run: python audit_mlb_team_crosswalk.py
      - name: Stage one 2025 season for all 30 teams, no publication
        run: python stage_mlb_league_player_stats.py --year 2025
      - name: Select leaders only, without a complete-roster totals requirement
        run: python select_mlb_player_leaders.py
      - name: Save leader selection for review
        uses: actions/upload-artifact@v4
        with:
          name: mlb-2025-selected-player-leaders-no-publication
          path: mlb/data/mlb-player-leaders-2025.json
          retention-days: 14
