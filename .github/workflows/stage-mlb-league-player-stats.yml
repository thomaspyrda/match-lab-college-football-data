name: Stage MLB Historical Player Leaders
on:
  workflow_dispatch:
    inputs:
      season:
        description: Historical season to stage
        required: true
        type: choice
        default: '2025'
        options: ['2025','2024','2023','2022','2021','2020','2019','2018','2017','2016','2015','2026']
  push:
    branches: [main]
    paths:
      - select_mlb_player_leaders.py
      - tests/test_select_mlb_player_leaders.py
      - .github/workflows/stage-mlb-league-player-stats.yml
permissions:
  contents: read
jobs:
  league-player-leaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused leader-selection tests
        run: python -m unittest discover -s tests -p test_select_mlb_player_leaders.py -v
      - name: Audit MLB team identities
        run: python audit_mlb_team_crosswalk.py
      - name: Stage selected season for all 30 teams, no publication
        env:
          YEAR: ${{ inputs.season || '2019' }}
        run: python stage_mlb_league_player_stats.py --year "$YEAR"
      - name: Select leaders only, without a complete-roster totals requirement
        env:
          YEAR: ${{ inputs.season || '2019' }}
        run: python select_mlb_player_leaders.py --year "$YEAR"
      - name: Save leader selection for review
        uses: actions/upload-artifact@v4
        with:
          name: mlb-selected-player-leaders-no-publication
          path: mlb/data/mlb-player-leaders-*.json
          retention-days: 14
