name: Build verified CBB Match Lab historical candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reconstruct_cbb_match_lab_history.py
      - build_cbb_match_lab_archive.py
      - tests/test_cbb_match_lab_archive.py
      - .github/workflows/build-cbb-match-lab-history.yml
permissions:
  contents: write
jobs:
  historical-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Test historical verification rules
        run: python -m pytest -q tests/test_cbb_match_lab_archive.py
      - name: Reconstruct only documented pregame scoring and lines
        run: python reconstruct_cbb_match_lab_history.py
      - name: Audit reconstructed historical records
        run: |
          python - <<'PY'
          import json
          from build_cbb_match_lab_archive import validated
          p='cbb/match-lab/data/verified-historical.json'
          d=json.load(open(p))
          games=d['games']
          assert len(games)==len(set(str(g['game_id']) for g in games)), 'Duplicate games'
          valid=[g for g in games if validated(g)]
          print('Reconstructed candidates:',len(games),'Eligible:',len(valid))
          assert len(valid)==len(games), 'Reject unverified historical candidates'
          PY
      - name: Publish nonempty verified historical archive
        run: |
          python -c 'import json; p="cbb/match-lab/data/verified-historical.json"; n=len(json.load(open(p))["games"]); print("Verified:",n); assert n>0, "No eligible games; refusing empty publication"'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbb/match-lab/data/verified-historical.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated CBB Match Lab history"
            git push
          fi
      - name: Upload reviewable historical dataset
        uses: actions/upload-artifact@v4
        with:
          name: cbb-match-lab-verified-candidates
          path: cbb/match-lab/data/verified-historical.json
          retention-days: 30
