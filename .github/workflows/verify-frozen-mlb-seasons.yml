name: Verify frozen MLB season archives
on:
  push:
    paths:
      - 'data/mlb/game-results/**'
      - 'data/mlb/frozen-season-sha256.json'
      - 'scripts/check_frozen_mlb_seasons.py'
  pull_request:
    paths:
      - 'data/mlb/game-results/**'
      - 'data/mlb/frozen-season-sha256.json'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure archived MLB game history is unchanged
        run: python scripts/check_frozen_mlb_seasons.py
