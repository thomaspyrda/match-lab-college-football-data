name: Aggressive top ten victory bonus
on:
  push:
    branches: [main]
    paths: [run_top10_victory_bonus_aggressive.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_top10_victory_bonus_aggressive.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/top10_victory_bonus_aggressive_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): save aggressive top-ten bonus'
          git pull --rebase origin main
          git push origin HEAD:main
