name: Validate Shared Daily Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - daily_backfill_core.py
      - tests/test_daily_backfill_core.py
      - .github/workflows/validate-daily-backfill.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared game and betting-market logic
        run: python -m unittest discover -s tests -p test_daily_backfill_core.py -v
