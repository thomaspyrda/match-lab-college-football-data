name: Inspect preserved Torvik preseason captures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Check recovered captures for complete preseason rankings
        run: python inspect_cbb_wayback_preseason.py
      - name: Match recovered preseason teams against the ESPN registry
        run: python audit_cbb_2018_preseason_registry.py --csv cbb/match-lab/imports/preseason-review/2018-candidate-rankings.csv
      - name: Preserve nonpublishing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torvik-wayback-capture-review
          path: |
            cbb/match-lab/imports/preseason-review/capture-review.json
            cbb/match-lab/imports/preseason-review/2018-candidate-rankings.csv
            cbb/match-lab/imports/preseason-review/2018-team-audit.json
