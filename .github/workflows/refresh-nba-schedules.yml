name: Refresh independent NBA full schedules
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh NBA Dashboard']
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths: ['build_nba_current_schedule.py', '.github/workflows/refresh-nba-schedules.yml']
  schedule:
    - cron: '0 6,18 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: nba-full-schedule-source
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_nba_page_updates.py -v
      - name: Collect all 30 verified full schedules
        run: |
          for attempt in 1 2 3; do
            if python build_nba_current_schedule.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - name: Publish schedule output only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba/teams/data/current-schedule.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh independent NBA full schedules'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
