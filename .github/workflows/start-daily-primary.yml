name: Start current WiseStats daily workflow
'on':
  push:
    branches:
    - main
    paths:
    - data/automation/primary-request.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: write
concurrency:
  group: start-wisestats-daily
  cancel-in-progress: false
jobs:
  start:
    name: Start current daily workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/start_daily_run.py --mode requested
