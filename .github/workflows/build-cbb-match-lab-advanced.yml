name: Build CBB Match Lab advanced pregame snapshots
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season ending year (2016–2026)'
        required: true
        default: '2025'
      all_seasons:
        description: 'Backfill all ending years 2016–2026 sequentially'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prior-game advanced statistical snapshots
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          if [ "${{ inputs.all_seasons }}" = "true" ]; then
            for year in $(seq 2016 2026); do
              echo "Building pregame CBB box statistics for $year"
              python build_cbb_match_lab_box_snapshots.py --season "$year"
            done
          else
            python build_cbb_match_lab_box_snapshots.py --season "${{ inputs.season }}"
          fi
      - name: Confirm 2017-18 numerical preseason ranks are present
        run: |
          python - <<'PY'
          import json
          data=json.load(open('cbb/match-lab/data/preseason-ranks.json'))
          assert len(data['seasons']['2018']) == 343
          assert len(data['historical_only']['2018']) == 8
          print('Confirmed 343 current-registry preseason rankings and 8 historical-only records')
          PY
      - name: Rebuild verified historical comparison archive
        run: python reconstruct_cbb_match_lab_history.py
      - name: Validate every historical comparison
        run: |
          python - <<'PY'
          import json
          from build_cbb_match_lab_archive import validated
          p='cbb/match-lab/data/verified-historical.json'
          games=json.load(open(p))['games']
          assert games and all(validated(g) for g in games)
          print('Verified historical games:',len(games))
          from collections import Counter
          advanced=('three_pct','efg_pct','oreb_pg','dreb_pg','assists_pg','turnover_margin','ft_pct')
          counts=Counter(k for g in games for k in advanced if k in g['home']['profile'] and k in g['away']['profile'])
          print('Validated advanced metric coverage by game:',dict(counts))
          with_preseason=[g for g in games if g['season']==2018]
          filled=sum('preseason_rank' in side['profile'] for g in with_preseason for side in (g['home'],g['away']))
          print('2017-18 historical comparisons:',len(with_preseason),'preseason team-profiles populated:',filled)
          if '${{ inputs.season }}' == '2018' and '${{ inputs.all_seasons }}' != 'true':
            assert len(with_preseason)>0, '2017-18 rebuild produced no eligible historical games'
          assert not with_preseason or filled>0, '2017-18 historical comparisons exist but no preseason rankings joined'
          PY
      - name: Publish validated snapshots and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbb/match-lab/data/box-pregame-*.json cbb/match-lab/data/verified-historical.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified CBB pregame advanced metrics for season ${{ inputs.season }}"
            git push
          fi
