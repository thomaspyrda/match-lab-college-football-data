name: Publish CBB live markets
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture CBB pregame markets']
    branches: [main]
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: cbb-dashboard-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check initial input readiness
        id: ready
        run: |
          ready=true
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Publish from saved verified facts
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/run_cbb_pipeline.py markets
      - name: Commit this publication only
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb/dashboard/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish CBB live markets from verified inputs'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    if: github.workflow != 'Ordered Active Sports Morning Update'
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

