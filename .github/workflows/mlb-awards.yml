name: Build MLB historical player awards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_mlb_award_winners.py
      - .github/workflows/mlb-awards.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect SABR Lahman historical awards
        run: python build_mlb_award_winners.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/mlb/award-winners.json"))
          assert len(d["awards"])==30
          assert sum(len(v) for t in d["awards"].values() for v in t.values())>1000
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/award-winners.json
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): compile historical MLB major award winners"
          git pull --rebase -X theirs origin main
          git push origin main
