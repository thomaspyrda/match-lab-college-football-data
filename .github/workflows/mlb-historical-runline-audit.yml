name: MLB historical run-line audit
on:
  push:
    paths:
      - '.github/workflows/mlb-historical-runline-audit.yml'
      - 'scripts/enrich_mlb_runlines.py'
      - 'tests/test_mlb_runline_enrichment.py'
  workflow_dispatch:
    inputs:
      season:
        description: "Historical season to audit (archive covers 2021 to Aug 2025)"
        required: true
        type: choice
        options: ["2024", "2023", "2022", "2021", "2025"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify importer syntax
        run: python -m py_compile scripts/enrich_mlb_runlines.py
      - name: Test game matching and cover logic
        run: python -m unittest discover -s tests -p 'test_mlb_runline_enrichment.py' -v
      - name: Download publicly released SBR archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          endpoint="https://api.github.com/repos/ArnavSaraogi/mlb-odds-scraper/releases/tags/dataset"
          h={"Accept":"application/vnd.github+json","User-Agent":"BetWise-MLB-Validation"}
          req=urllib.request.Request(endpoint,headers=h)
          with urllib.request.urlopen(req,timeout=30) as r: meta=json.load(r)
          assets=meta.get("assets",[])
          candidates=[a for a in assets if a.get("name","").lower().endswith(".json")]
          if not candidates:
              raise SystemExit("No downloadable JSON asset in public historical odds release: "+str([a["name"] for a in assets]))
          asset=max(candidates,key=lambda a:a.get("size",0))
          print("Archive asset:",asset["name"],"Size:",asset["size"])
          req=urllib.request.Request(asset["browser_download_url"],headers={"User-Agent":"BetWise-MLB-Validation"})
          with urllib.request.urlopen(req,timeout=150) as r,open("historical-odds.json","wb") as out:
              while True:
                  b=r.read(1024*1024)
                  if not b:break
                  out.write(b)
          with open("historical-odds.json","rb") as f: json.load(f)
          print("Download verified as JSON")
          PY
      - name: Audit against official MLB final results
        run: |
          python scripts/enrich_mlb_runlines.py --odds historical-odds.json --season "${{ inputs.season || '2024' }}" | tee audit-report.txt
      - name: Validate and publish complete historical seasons
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          for year in (2022, 2023):
              print("Validating season",year,flush=True)
              p=pathlib.Path(f"data/mlb/game-results/{year}.json")
              official=json.loads(p.read_text())
              proc=subprocess.run([sys.executable,"scripts/enrich_mlb_runlines.py","--odds","historical-odds.json","--season",str(year),"--write"],capture_output=True,text=True)
              if proc.returncode:
                  print(proc.stdout,proc.stderr)
                  raise SystemExit(f"Season {year} enrichment failed")
              enriched=json.loads(p.read_text())
              # Recheck official records and all paired sides after enrichment.
              game_rows=[g for team in enriched["teams"].values() for g in team["games"] if g.get("team_runline_side") in (-1.5,1.5)]
              n=len(game_rows)//2
              official_ids=sum(len(t["games"]) for t in official["teams"].values())//2
              rate=n/official_ids if official_ids else 0
              print(year, "verified games",n,"eligible games",official_ids,"coverage",round(rate*100,2),flush=True)
              if len(game_rows)!=n*2 or rate<0.95:
                  raise SystemExit(f"Season {year} below 95% verification gate")
              for g in game_rows:
                  side=g["team_runline_side"]
                  runs,opp=map(int,g["score"].split("-"))
                  expected="W" if runs+side>opp else "L"
                  assert g["team_runline_result"]==expected
              print("VALIDATED",year,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/game-results/2022.json data/mlb/game-results/2023.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified 2022 and 2023 MLB run-line results"
            git push
          fi
      - name: Preserve audit outcome in repository
        if: always()
        run: |
          mkdir -p data/mlb/audits
          {
            echo "Audit run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Season: ${{ inputs.season || '2024' }}"
            echo "Commit: $GITHUB_SHA"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -f audit-report.txt ]; then cat audit-report.txt; else echo 'AUDIT INCOMPLETE — no run-line coverage verified. Inspect workflow job logs for failed step.'; fi
          } > "data/mlb/audits/${{ inputs.season || '2024' }}-runline-audit.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/mlb/audits/${{ inputs.season || '2024' }}-runline-audit.txt"
          git commit -m "Record MLB historical run-line audit results for ${{ inputs.season || '2024' }}" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-runline-audit-${{ inputs.season || '2024' }}
          path: audit-report.txt
          if-no-files-found: ignore
