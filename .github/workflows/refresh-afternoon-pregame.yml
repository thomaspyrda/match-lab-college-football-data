name: Afternoon pregame data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * *'
      timezone: America/New_York
    - cron: '0 17 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: afternoon-pregame-data
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update observed NBA MLB CBB pregame fields only
        run: python refresh_afternoon_pregame.py
      - name: Commit pregame snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba/dashboard/data/dashboard.json mlb/dashboard/data/dashboard.json cbb/dashboard/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update afternoon pregame market snapshots'
          git pull --rebase -X theirs origin main
          git push origin main
