name: Inspect CBB historical Torvik catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb pytz
      - name: Inspect actual remote DuckDB schema without publishing rankings
        run: |
          python - <<'PY'
          import duckdb
          import urllib.request, os
          url="https://basketball-data.billmill.org/ncaam/ncaam.duckdb"
          local="/tmp/ncaam-readonly.duckdb"
          req=urllib.request.Request(url,headers={"User-Agent":"BetWise-CBB-Historical-Research/1.0"})
          with urllib.request.urlopen(req,timeout=120) as src, open(local,"wb") as dst:
              while True:
                  block=src.read(1024*1024)
                  if not block:break
                  dst.write(block)
          print("Downloaded catalog bytes:",os.path.getsize(local))
          db=duckdb.connect()
          try:
              db.execute("ATTACH ? AS archive (READ_ONLY)",[local])
              tables=db.execute("SELECT schema_name, table_name FROM duckdb_tables() WHERE database_name = ? ORDER BY table_name",["archive"]).fetchall()
              print("Archive tables:",tables)
              views=db.execute("SELECT schema_name, view_name FROM duckdb_views() WHERE database_name = ? ORDER BY view_name",["archive"]).fetchall()
              print("Archive views:",views)
              definitions=db.execute("SELECT view_name,sql FROM duckdb_views() WHERE database_name = ?",["archive"]).fetchall()
              for name,definition in definitions:
                  if name in ("torvik_ratings_daily","torvik_team_results"):
                      print("VIEW DEFINITION:",name,str(definition)[:500])
              for schema,name in tables+views:
                  if True:
                      print(schema,name,db.execute("SELECT column_name,data_type FROM duckdb_columns() WHERE database_name=? AND schema_name=? AND table_name=? ORDER BY column_index",["archive",schema,name]).fetchall())
                      if name=="metadata": print("Catalog metadata:",db.execute("SELECT * FROM archive.main.metadata LIMIT 3").fetchall())
          except Exception as exc:
              print("Cannot validate remote DuckDB archive:",type(exc).__name__,str(exc)[:500])
              raise
          PY
