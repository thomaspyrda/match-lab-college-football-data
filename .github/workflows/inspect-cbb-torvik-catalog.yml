name: Inspect CBB historical Torvik catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - name: Inspect actual remote DuckDB schema without publishing rankings
        run: |
          python - <<'PY'
          import duckdb
          import urllib.request, os
          url="https://basketball-data.billmill.org/ncaam/ncaam.duckdb"
          local="/tmp/ncaam-readonly.duckdb"
          req=urllib.request.Request(url,headers={"User-Agent":"BetWise-CBB-Historical-Research/1.0"})
          with urllib.request.urlopen(req,timeout=120) as src, open(local,"wb") as dst:
              while True:
                  block=src.read(1024*1024)
                  if not block:break
                  dst.write(block)
          print("Downloaded catalog bytes:",os.path.getsize(local))
          db=duckdb.connect()
          try:
              db.execute("ATTACH ? AS archive (READ_ONLY)",[local])
              tables=db.execute("SELECT table_schema,table_name FROM archive.information_schema.tables ORDER BY table_name").fetchall()
              print("Archive tables:",tables)
              for schema,name in tables:
                  if any(term in name.lower() for term in ("torvik","team","rating")):
                      print(schema,name,db.execute("SELECT column_name,data_type FROM archive.information_schema.columns WHERE table_name=? ORDER BY ordinal_position",[name]).fetchall())
          except Exception as exc:
              print("Cannot validate remote DuckDB archive:",type(exc).__name__,str(exc)[:500])
              raise
          PY
