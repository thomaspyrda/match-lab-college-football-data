name: Audit MLB Historical Hitter Coverage (Review Only)
on:
  push:
    branches:
      - audit/mlb-player-historical-2015-2026
    paths:
      - '.github/workflows/audit-mlb-historical-hitters.yml'
      - 'tests/test_audit_mlb_historical_leader_coverage.py'
      - 'audit_mlb_historical_leader_coverage.py'
      - 'select_mlb_player_leaders.py'
      - 'audit_mlb_historical_pitcher_coverage.py'
      - 'tests/test_audit_mlb_historical_pitcher_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fast mocked verification tests
        run: python -m unittest discover -s tests -p test_audit_mlb_historical_leader_coverage.py -v
      - name: Focused pitcher verification regression tests
        run: python -m unittest discover -s tests -p test_audit_mlb_historical_pitcher_coverage.py -v
      - name: Retrieve consolidated archived review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mlb-review
          gh run download 39092851946 -R "$GITHUB_REPOSITORY" -n mlb-2015-2026-historical-player-review-no-publication -D /tmp/mlb-review
          test -f /tmp/mlb-review/mlb-historical-player-leaders-review.json
      - name: Validate selected hitters, read-only
        run: |
          python audit_mlb_historical_leader_coverage.py --input /tmp/mlb-review/mlb-historical-player-leaders-review.json --years 2019,2020,2025,2026 --team-ids 115,117,119,133,139,147 --out /tmp/mlb-review/mlb-hitter-coverage-sample.json
      - name: Validate selected pitchers, read-only
        run: |
          python audit_mlb_historical_pitcher_coverage.py --input /tmp/mlb-review/mlb-historical-player-leaders-review.json --years 2019,2020,2025,2026 --team-ids 115,117,119,133,139,147 --out /tmp/mlb-review/mlb-pitcher-coverage-sample.json
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hitter-coverage-sample-audit-no-publication
          path: |
            /tmp/mlb-review/mlb-hitter-coverage-sample.json
            /tmp/mlb-review/mlb-pitcher-coverage-sample.json
          retention-days: 30
