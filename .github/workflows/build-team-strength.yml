name: Build Team Strength
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh CFB verified results']
    branches: [main]
    types: [completed]
  schedule:
    - cron: '10 6 * * 0'
      timezone: America/New_York
    - cron: '30 9 * * 0'
      timezone: America/New_York
    - cron: '10 6 * * 1'
      timezone: America/New_York
    - cron: '15 11 * * 0'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - enrich_team_strength.py
      - build_web_data.py
      - refresh_match_lab.py
      - build_advanced_profiles.py
      - test_advanced_profiles.py
      - experiment_standardized_power.py
      - experiment_expected_performance.py
      - experiment_dominance_v6.py
      - experiment_dominance_v7.py
      - experiment_dominance_v8.py
      - experiment_dominance_v9.py
      - experiment_dominance_v10.py
      - experiment_dominance_v11.py
      - experiment_dominance_v12.py
      - experiment_dominance_v13.py
      - experiment_dominance_v14.py
      - experiment_dominance_v15.py
      - promote_v15_live.py
      - promote_four_unit_live.py
      - research_four_unit_nonrecursive_2026.py
      - build_approved_strength_model.py
      - scripts/validate_weekly_cfb_freshness.py
      - calibrate_sd_to_sd_v14.py
      - validate_v14_final.py
      - validate_v14_final_fixed.py
      - validate_v14_final_source_aligned.py
      - validate_v15_final_source_aligned.py
      - diagnose_finishing_schema.py
      - calibrate_opponent_interaction_v13.py
      - calibrate_opponent_significance_v12.py
      - calibrate_opponent_multipliers.py
      - calibrate_fcs_expectations.py
      - calibrate_fcs_expectations_v8.py
      - build_weekly_dominance_audit.py
      - index.html
      - app.js
      - styles.css
      - build_ap_elo.py
      - CNAME
      - robots.txt
      - sitemap.xml
      - build_seo_pages.py
      - data/current_rankings.json
      - match_lab_ap_elo_master.csv
      - match_lab_game_ap_elo.csv
concurrency:
  group: team-strength-production
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  enrich:
    if: (github.event_name != 'push' || github.actor != 'github-actions[bot]') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require current verified results before ranking calculations
        run: python scripts/run_cfb_pipeline.py require-results --store data/cfb/pipeline
      - run: python enrich_team_strength.py
      - run: python build_web_data.py
      - name: Build pregame advanced percentile profiles
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if python build_advanced_profiles.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Refresh upcoming games and historical market index
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/run_cfb_pipeline.py ranking-inputs --store data/cfb/pipeline; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - run: python -m unittest -v test_build.py
      - run: python -m unittest -v test_advanced_profiles.py
      - name: Validate fresh CFB results before modeling
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: python scripts/validate_weekly_cfb_freshness.py --stage input
      - name: Generate approved season-aware chronological ratings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_approved_strength_model.py
      - name: Promote approved 15 percent uncapped margin and SOS model
        run: python promote_four_unit_live.py
      - name: Validate approved model publication
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: python scripts/validate_weekly_cfb_freshness.py --stage output
      - name: Build ranking and SEO pages
        run: python build_seo_pages.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only CFB source and generated outputs, never another sport's files.
          git add -A -- data \
            ':(exclude)data/mlb/**' ':(exclude)data/nba/**' \
            ':(exclude)data/cbb/**' ':(exclude)data/nfl/**' \
            ':(exclude)data/cfb/pipeline/**' ':(exclude)data/dashboard-availability/**'
          git add -A -- college-football-team-strength-rankings \
            college-football-offensive-strength-rankings \
            college-football-defensive-strength-rankings \
            college-football-strength-of-schedule-rankings \
            college-football-matchup-tool college-football/matchups
          git add -A -- sitemap-*.xml
          git add -u -- index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Generate validated Team Strength datasets"
          # Discard non-published working-tree changes before rebasing.
          git restore --worktree .
          # Another sport may publish while CFB is building. Rebase and retry
          # rather than allow a transient non-fast-forward push to lose the update.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Unable to publish after five safe push attempts" >&2
          exit 1

