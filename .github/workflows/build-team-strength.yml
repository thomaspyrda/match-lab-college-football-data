name: Build Team Strength
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - enrich_team_strength.py
      - build_web_data.py
      - refresh_match_lab.py
      - build_advanced_profiles.py
      - test_advanced_profiles.py
      - experiment_standardized_power.py
      - experiment_expected_performance.py
      - experiment_dominance_v6.py
      - experiment_dominance_v7.py
      - experiment_dominance_v8.py
      - experiment_dominance_v9.py
      - experiment_dominance_v10.py
      - experiment_dominance_v11.py
      - experiment_dominance_v12.py
      - experiment_dominance_v13.py
      - experiment_dominance_v14.py
      - calibrate_sd_to_sd_v14.py
      - validate_v14_final.py
      - validate_v14_final_fixed.py
      - diagnose_finishing_schema.py
      - calibrate_opponent_interaction_v13.py
      - calibrate_opponent_significance_v12.py
      - calibrate_opponent_multipliers.py
      - calibrate_fcs_expectations.py
      - calibrate_fcs_expectations_v8.py
      - build_weekly_dominance_audit.py
      - index.html
      - app.js
      - styles.css
      - build_ap_elo.py
      - CNAME
      - robots.txt
      - sitemap.xml
      - build_seo_pages.py
      - data/current_rankings.json
      - match_lab_ap_elo_master.csv
      - match_lab_game_ap_elo.csv
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python enrich_team_strength.py
      - run: python build_web_data.py
      - name: Build pregame advanced percentile profiles
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_advanced_profiles.py
      - name: Refresh upcoming games and historical market index
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python refresh_match_lab.py
      - run: python -m unittest -v test_build.py
      - run: python -m unittest -v test_advanced_profiles.py
      - name: Build backend standardized power experiment
        run: python experiment_standardized_power.py
      - name: Build opponent-expectation power experiment
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_expected_performance.py
      - name: Calibrate FCS expectations from 2022-2025
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_fcs_expectations.py
      - name: Build experimental v7 calibrated-FCS dominance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v7.py
      - name: Calibrate v8 expanded FCS expectations from 2022-2025
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_fcs_expectations_v8.py
      - name: Build experimental v8 expanded-metric dominance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v8.py
      - name: Calibrate continuous v9 opponent multipliers from 2022-2025
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_opponent_multipliers.py
      - name: Build experimental v9 continuous-multiplier dominance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v9.py
      - name: Build experimental v10 shared-SOS dominance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v10.py
      - name: Build experimental v11 logarithmic-SOS dominance model # validation-2
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v11.py
      - name: Calibrate v12 opponent significance on 2022-2024 and validate on 2025
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_opponent_significance_v12.py
      - name: Build experimental v12 residual-calibrated opponent significance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v12.py
      - name: Calibrate v13 asymmetric opponent interaction
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_opponent_interaction_v13.py
      - name: Build experimental v13 performance-opponent interaction model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v13.py
      - name: Calibrate v14 direct SD-to-SD opponent adjustment
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python calibrate_sd_to_sd_v14.py
      - name: Build experimental v14 direct SD-to-SD model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v14.py
      - name: Validate v14 week-by-week pregame reconstruction
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python validate_v14_final_fixed.py
      - name: Diagnose finishing metric source schema
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python diagnose_finishing_schema.py
      - name: Build experimental v6 FCS-aware dominance model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python experiment_dominance_v6.py
      - name: Build week-by-week dominance audit
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_weekly_dominance_audit.py
      - run: sha256sum -c SHA256SUMS.txt
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Generate validated Team Strength datasets"
          git push

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build crawlable CFB archive and sitemaps
        run: python build_seo_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
