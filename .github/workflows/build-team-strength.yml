name: Build Team Strength
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - enrich_team_strength.py
      - build_web_data.py
      - refresh_match_lab.py
      - build_advanced_profiles.py
      - test_advanced_profiles.py
      - index.html
      - app.js
      - styles.css
      - build_ap_elo.py
      - CNAME
      - robots.txt
      - sitemap.xml
      - build_seo_pages.py
      - match_lab_ap_elo_master.csv
      - match_lab_game_ap_elo.csv
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python enrich_team_strength.py
      - run: python build_web_data.py
      - name: Build pregame advanced percentile profiles
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_advanced_profiles.py
      - name: Refresh upcoming games and historical market index
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python refresh_match_lab.py
      - name: Build indexable college football matchup pages
        run: python build_seo_pages.py
      - run: python -m unittest -v test_build.py
      - run: python -m unittest -v test_advanced_profiles.py
      - run: sha256sum -c SHA256SUMS.txt
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Generate validated Team Strength datasets"
          git push

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
