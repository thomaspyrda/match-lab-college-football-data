name: Assemble and publish CFB dashboard
on:
  workflow_call:
permissions:
  contents: write
jobs:
  publish:
    concurrency:
      group: cfb-dashboard-data
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebb7892f2300f67e174e4d57abeb9b18cdf4ee60
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .pipeline-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dashboard test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check bootstrap component readiness
        id: ready
        run: |
          ready=true
          for component in results strength metrics players; do
            if [ ! -f ".pipeline-code/data/cfb/pipeline/$component.json" ]; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then echo "Waiting for initial verified inputs; published dashboard remains intact."; fi
      - name: Verify established dashboard rules
        if: steps.ready.outputs.ready == 'true'
        env:
          PYTHONPATH: .
        run: python -m pytest -q cfb_dashboard/tests
      - name: Assemble from verified snapshots without provider requests
        if: steps.ready.outputs.ready == 'true'
        env:
          PYTHONPATH: .
        run: python .pipeline-code/scripts/run_cfb_pipeline.py assemble --store .pipeline-code/data/cfb/pipeline
      - name: Publish data only
        if: steps.ready.outputs.ready == 'true'
        run: |
          cp cfb_dashboard/data/dashboard.json .pipeline-code/cfb-dashboard-preview/data/dashboard.json
          cp cfb_dashboard/data/location-records.json .pipeline-code/cfb-dashboard-preview/data/location-records.json
          cd .pipeline-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cfb-dashboard-preview/data/dashboard.json cfb-dashboard-preview/data/location-records.json data/cfb/pipeline/status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish CFB dashboard from independently verified components'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
