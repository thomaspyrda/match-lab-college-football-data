name: Build CBB Team Strength
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh CBB team metrics']
    types: [completed]
  schedule:
    - cron: '0 17 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - build_cbb_strength.py
      - collect_cbb_strength_games.py
      - publish_cbb_strength.py
      - tests/test_cbb_strength.py
      - data/cbb/preseason/**
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cbb-strength-production
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check strength model rules
        run: python -m unittest discover -s tests -p test_cbb_strength.py -v
      - name: Collect verified final results
        run: python scripts/run_cbb_pipeline.py strength-inputs
      - name: Calculate daily strength and archive snapshot
        run: |
          season=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo("America/New_York")); print(n.year+(n.month>=7))')
          python build_cbb_strength.py --season "$season"
      - name: Publish strength ranking pages
        run: python scripts/run_cbb_pipeline.py strength-publish
      - name: Publish CBB strength outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbb/strength-games data/cbb/strength-history data/cbb/strength-rankings.json data/cbb/strength-observations.json cbb/rankings
          git diff --cached --quiet && exit 0
          git commit -m 'Publish daily verified CBB Team Strength rankings'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1


  deploy:
    if: github.workflow != 'Ordered Active Sports Morning Update'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml


