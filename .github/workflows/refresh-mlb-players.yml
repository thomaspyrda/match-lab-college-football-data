name: Refresh independent MLB player statistics
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh independent MLB team metrics']
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths: ['mlb_player_source.py', '.github/workflows/refresh-mlb-players.yml']
  schedule:
    - cron: '55 3 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: mlb-player-stat-source
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_mlb_player_source.py -v
      - run: python mlb_player_source.py
      - name: Publish player statistics only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'mlb/pipeline/player-statistics-*.json'
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh independent MLB player statistics'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
