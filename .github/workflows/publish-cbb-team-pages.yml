name: Publish CBB Team Page Layouts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publish_cbb_team_archives.py
      - sports-research/cbb-team-archive-v1.js
      - sports-research/cbb-team-archive-v1.css
      - .github/workflows/publish-cbb-team-pages.yml
permissions:
  contents: write
concurrency:
  group: cbb-team-archives
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish CBB team page layouts from existing archives
        run: python publish_cbb_team_archives.py
      - name: Verify Duke team page uses the current renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('cbb/teams/duke-blue-devils/index.html').read_text()
          assert 'cbb-team-archive-v1.js?v=20261029-cbb-rank-only-v7' in html
          assert 'cbb-team-archive-v1.css?v=20261029-cbb-rank-only-v7' in html
          print('Verified CBB page renderer and stylesheet references')
          PY
      - name: Publish CBB team page references only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbb/teams
          git diff --cached --quiet && exit 0
          git commit -m 'pages(cbb): refresh all team-page layouts'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              git reset --hard origin/main
              python publish_cbb_team_archives.py
              git add cbb/teams
              git diff --cached --quiet && exit 0
              git commit -m 'pages(cbb): regenerate asset references on latest main'
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

