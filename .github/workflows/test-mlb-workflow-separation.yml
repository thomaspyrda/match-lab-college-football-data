name: Test MLB workflow separation
on:
  pull_request:
    paths: ['verify_mlb_pipeline.py', 'tests/test_mlb_live_health.py', 'mlb_market_source.py', 'tests/test_mlb_market_source.py', 'mlb_lineup_source.py', 'tests/test_mlb_lineup_source.py', 'mlb_player_source.py', 'tests/test_mlb_player_source.py', 'mlb_metric_source.py', 'refresh_mlb_dashboard.py', 'tests/test_mlb_metric_source.py', '.github/workflows/*mlb*', '.github/workflows/deploy-pages.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p test_mlb_live_health.py -v
          python -m unittest discover -s tests -p test_mlb_market_source.py -v
          python -m unittest discover -s tests -p test_mlb_lineup_source.py -v
          python -m unittest discover -s tests -p test_mlb_player_source.py -v
          python -m unittest discover -s tests -p test_mlb_metric_source.py -v
          python -m unittest discover -s tests -p test_new_sport_dashboards.py -v
