        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_dashboard/pipeline/refresh_venues.py
      - name: Run dashboard unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q cfb_dashboard/tests
      - name: Build dashboard from checked-in artifacts
        env:
          PYTHONPATH: .
        run: python -m cfb_dashboard.pipeline.build_dashboard
      - name: Validate generated dashboard contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("cfb_dashboard/data/dashboard.json")
          d=json.loads(p.read_text())
          assert isinstance(d.get("games"),list)
          assert d.get("slate",{}).get("model_version")=="v15", d.get("slate")
          for g in d["games"]:
              assert g.get("away",{}).get("name")
              assert g.get("home",{}).get("name")
              assert isinstance(g.get("matchup_metrics"),list)
              assert "trends" in g
              assert "market" in g
              assert "context" in g
              assert g.get("away",{}).get("espn_id"), g.get("away",{}).get("name")
              assert g.get("home",{}).get("espn_id"), g.get("home",{}).get("name")
              assert "weather" in g
              # Some games legitimately have no posted market yet; structure must exist, values may be pending.\n              assert isinstance(g.get("market"),dict)
          missing_metrics=sum(1 for g in d["games"] if not any(
              isinstance(v,(int,float)) for m in g["matchup_metrics"] for v in
              (m.get("away_offense"),m.get("home_defense"),m.get("home_offense"),m.get("away_defense"))
          ))
          assert missing_metrics==0, f"{missing_metrics} games have no usable matchup metrics"
          print(f'Validated {len(d["games"])} CFB Dashboard matchups')
          PY
      - name: Assemble preview artifact
        run: |
          rm -rf cfb-dashboard-preview
          mkdir -p cfb-dashboard-preview/data cfb-dashboard-preview/assets
          cp cfb_dashboard/index.html cfb-dashboard-preview/
          cp cfb_dashboard/styles.css cfb-dashboard-preview/
          cp cfb_dashboard/app.js cfb-dashboard-preview/
          cp cfb_dashboard/data/dashboard.json cfb-dashboard-preview/data/
          if [ -f assets/betwise-logo.png ]; then cp assets/betwise-logo.png cfb-dashboard-preview/assets/; fi
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-dashboard-preview
          path: cfb-dashboard-preview
          retention-days: 7