name: Validate CFB Dashboard foundation
'on':
  workflow_dispatch: {}
  # Periodic validation disabled; the independent schedule-only job owns live schedule publication.
  push:
    branches: [cfb-dashboard-foundation]
    paths:
      - "cfb_dashboard/**"
      - "promote_v15_live.py"
      - "refresh_match_lab.py"
      - ".github/workflows/validate-cfb-dashboard.yml"
permissions:
  contents: write
concurrency:
  group: cfb-dashboard-preview
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-dashboard-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Refresh current Match Lab source data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python refresh_match_lab.py
      - name: Build missing frozen V15 week output
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          MODEL_WEEK=$(python -c 'import json; print(int(json.load(open("data/current_rankings.json"))["week"]))')
          if [ ! -f "data/experiments/recursive_unit_strength_v15_2026_week_${MODEL_WEEK}.json" ]; then
            MODEL_WEEK="$MODEL_WEEK" python experiment_dominance_v15.py
          fi
      - name: Promote frozen V15 into refreshed profiles
        env:
          PYTHONPATH: .
        run: python promote_v15_live.py
      - name: Refresh venue metadata
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_dashboard/pipeline/refresh_venues.py
      - name: Run dashboard unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q cfb_dashboard/tests
      - name: Build dashboard
        env:
          PYTHONPATH: .
        run: python -m cfb_dashboard.pipeline.build_dashboard
      - name: Build conference team directory
        env:
          PYTHONPATH: .
        run: python -m cfb_dashboard.pipeline.build_teams
      - name: Validate generated dashboard contract
        run: python cfb_dashboard/pipeline/validate_launch.py
      - name: Publish validated data only
        run: |
          git clone --depth 1 --branch main "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/matchlab-main
          mkdir -p /tmp/matchlab-main/cfb-dashboard-preview/data
          cp cfb_dashboard/data/dashboard.json /tmp/matchlab-main/cfb-dashboard-preview/data/dashboard.json
          cd /tmp/matchlab-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb-dashboard-preview/data/dashboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated frozen CFB Dashboard data"
          git pull --rebase origin main
          git push origin main
