name: Refresh CFB weather and venues
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/cfb-collect-component.yml
    with:
      component: context
    secrets: inherit
