name: Publish WiseStats on public standard runner
'on':
  workflow_call:
    inputs:
      morning_date:
        type: string
        required: false
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: wisestats-public-hosted-publication
  cancel-in-progress: false
  queue: single
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Enforce the Eastern morning window
      shell: python
      env:
        MORNING_DATE: ${{ inputs.morning_date }}
      run: |
        from datetime import datetime
        from zoneinfo import ZoneInfo
        import os

        local = datetime.now(ZoneInfo("America/New_York"))
        expected_date = os.environ.get("MORNING_DATE")
        cutoff_hour = 17 if expected_date == "2026-11-25" else 11
        if not 2 <= local.hour < cutoff_hour or (expected_date and expected_date != str(local.date())):
            raise SystemExit("Outside the current 02:00–11:00 Eastern publication window.")
        cutoff = local.replace(hour=cutoff_hour, minute=0, second=0, microsecond=0)
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'WISESTATS_MORNING_CUTOFF={int(cutoff.timestamp())}\n')
    - name: Check required private repository credential
      env:
        ACCESS_TOKEN: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
      run: |
        if [ -z "$ACCESS_TOKEN" ]; then
          echo '::error::Add WISESTATS_AUTOMATION_TOKEN to this repository. It needs Contents read/write on wisestats-site and betwise-nfl-matchup-dashboard.'
          exit 1
        fi
    - name: Checkout private publisher
      uses: actions/checkout@v4
      with:
        repository: thomaspyrda/wisestats-site
        ref: main
        path: site
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
    - name: Checkout private NFL source
      uses: actions/checkout@v4
      with:
        repository: thomaspyrda/betwise-nfl-matchup-dashboard
        ref: main
        path: site/.sources/nfl
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        persist-credentials: false
    - name: Checkout public sports source
      uses: actions/checkout@v4
      with:
        ref: main
        path: site/.sources/sports
        persist-credentials: false
    - name: Checkout verified Prop Lab release
      uses: actions/checkout@v4
      with:
        repository: thomaspyrda/wisestats-site
        ref: prop-lab-private-research
        path: site/.sources/prop-lab
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install workflow reader
      run: python3 -m pip install PyYAML==6.0.3
    - name: Build, publish and verify live site
      working-directory: site
      env:
        WISESTATS_SOURCE_EVENT: '{"source_repository":"public-hosted-publisher","source_conclusion":"manual-verification"}'
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        remaining=$((WISESTATS_MORNING_CUTOFF - $(date +%s) - 5))
        if (( remaining <= 0 )); then
          echo 'Eastern cutoff reached before publication.'
          exit 1
        fi
        timeout --kill-after=5s "${remaining}s" python3 scripts/run_public_publication.py
