name: Update NBA team style cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_nba_style_cache.py
      - .github/workflows/update-nba-style-cache.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_nba_style_cache.py
      - name: Commit changed team pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba/teams/*/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh NBA team page cache for ATS and OU colors'
          git pull --rebase -X theirs origin main
          git push origin main
