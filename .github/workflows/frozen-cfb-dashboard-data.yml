name: Frozen CFB Dashboard Data
# Existing dashboard calculations; independent verified inputs and offline assembly.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh CFB dashboard strength', 'Refresh CFB team metrics', 'Refresh CFB player statistics', 'Refresh CFB weather and venues']
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/cfb-publish-dashboard.yml
    secrets: inherit
