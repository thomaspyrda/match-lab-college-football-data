name: Verify and recover morning publication
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
      timezone: America/New_York
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify current sources and live publication
        id: audit
        continue-on-error: true
        run: python3 scripts/verify_morning_publication.py --sport all
      - name: Recover missing publication without interrupting an active coordinator
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({...context.repo,
              workflow_id: 'coordinate-sport-data.yml', per_page: 30});
            const active = data.workflow_runs.some(run => ['queued','in_progress','waiting','pending','requested'].includes(run.status));
            if (active) {
              core.warning('Morning coordinator is still active. Live publication is not yet verified.');
            } else {
              await github.rest.repos.createDispatchEvent({...context.repo, event_type: 'morning-refresh'});
              core.warning('Recovery requested. This audit remains failed until a subsequent live check succeeds.');
            }
      - name: Report incomplete publication
        if: steps.audit.outcome == 'failure'
        run: exit 1
