name: Verify and recover morning publication
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
      timezone: America/New_York
    - cron: '30 5 * * *'
      timezone: America/New_York
    - cron: '45 5 * * *'
      timezone: America/New_York
permissions:
  contents: read
  actions: write
concurrency:
  group: verify-morning-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout current NFL source for read-only verification
        uses: actions/checkout@v4
        with:
          repository: thomaspyrda/betwise-nfl-matchup-dashboard
          ref: main
          path: .sources/nfl
          token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
          persist-credentials: false
      - name: Check sports sources and actual live files separately
        run: |
          python3 scripts/verify_morning_publication.py --sport all --report sports-morning-report.json || true
          python3 scripts/verify_morning_publication.py --sport nfl --root .sources/nfl --report nfl-morning-report.json || true
      - name: Verify selective recovery safeguards
        run: node scripts/test_recover_morning_publication.cjs
      - name: Recover only missing or failed stages
        uses: actions/github-script@v7
        with:
          script: |
            const recover = require('./scripts/recover_morning_publication.cjs');
            await recover({github, context, core});

