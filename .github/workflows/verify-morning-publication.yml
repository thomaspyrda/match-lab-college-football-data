name: Verify morning publication without recovery
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-morning-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - name: Checkout current NFL source for read-only verification
      uses: actions/checkout@v4
      with:
        repository: thomaspyrda/betwise-nfl-matchup-dashboard
        ref: main
        path: .sources/nfl
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        persist-credentials: false
    - name: Check sports sources and actual live files separately
      run: |
        python3 scripts/verify_morning_publication.py --sport all
        WISESTATS_PLAN_ROOT="$GITHUB_WORKSPACE" python3 scripts/verify_morning_publication.py --sport nfl --root .sources/nfl
