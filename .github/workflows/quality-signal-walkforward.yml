name: Quality signal walk-forward
on:
  push:
    branches: [main]
    paths: [run_quality_signal_walkforward.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_quality_signal_walkforward.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/quality_signal_walkforward_2024_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): walkforward signal results'
          git pull --rebase origin main
          git push origin HEAD:main
