name: Publish CFB live markets
on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh CFB live markets']
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: cfb-dashboard-data
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish quotes without depending on statistical collectors
        run: python scripts/run_cfb_pipeline.py publish-markets --store data/cfb/pipeline
      - name: Commit quote overlay only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cfb-dashboard-preview/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish independently verified CFB live markets'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
