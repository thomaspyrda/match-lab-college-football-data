name: Export fullmetric week 7 top 50
on:
  push:
    branches: [main]
    paths: [export_fullmetric_week7_top50.py]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python export_fullmetric_week7_top50.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/fullmetric_week7_top50_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): export week 7 Top 50'
          git pull --rebase origin main
          git push origin HEAD:main
