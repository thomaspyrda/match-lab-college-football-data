name: Build MLB coaching histories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_mlb_coaching_history.py
      - .github/workflows/mlb-coaching-history.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect historical managerial tenures
        run: python build_mlb_coaching_history.py
      - name: Validate dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/mlb/coaching-history.json"))
          assert len(d["teams"])==30
          assert all(len(v)==12 for v in d["teams"].values())
          assert all(v[str(year)]["managers"] for v in d["teams"].values() for year in range(2015,2026))
          PY
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/coaching-history.json
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): populate 2015–2025 manager histories"
          git pull --rebase -X theirs origin main
          git push origin main
