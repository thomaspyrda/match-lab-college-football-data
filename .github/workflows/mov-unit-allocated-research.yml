name: Allocated MOV research
on:
  push:
    branches: [main]
    paths: [run_mov_unit_allocated_research.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_mov_unit_allocated_research.py
      - name: Commit research results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/mov_unit_allocated_comparison_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): compare unit-allocated MOV'
          git pull --rebase origin main
          git push origin HEAD:main
