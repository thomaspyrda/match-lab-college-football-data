name: Run private NFL processing on public standard runner
on:
  schedule:
    - cron: '15 3 * * *'
      timezone: America/New_York
    - cron: '15 6 * * *'
      timezone: America/New_York
    - cron: '0 7 * * *'
      timezone: America/New_York
    - cron: '15 17 * * *'
      timezone: America/New_York
    - cron: '17 10 * * *'
      timezone: America/New_York
    - cron: '30 18 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      task:
        type: choice
        required: true
        default: morning
        options: [morning, context, afternoon, leaders, audit]
permissions:
  contents: read
concurrency:
  group: nfl-public-processing
  cancel-in-progress: false
  queue: max
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check private source credential
        env:
          ACCESS_TOKEN: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        run: test -n "$ACCESS_TOKEN"
      - name: Checkout private NFL source
        uses: actions/checkout@v4
        with:
          repository: thomaspyrda/betwise-nfl-matchup-dashboard
          ref: main
          path: nfl
          token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing model and workflow dependencies
        run: python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - name: Run existing private source processing
        working-directory: nfl
        env:
          NFL_TASK: ${{ inputs.task || 'morning' }}
          NFL_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          case "$NFL_SCHEDULE" in
            '15 6 * * *'|'0 7 * * *') NFL_TASK=leaders ;;
            '15 17 * * *') NFL_TASK=afternoon ;;
            '30 18 * * *') NFL_TASK=audit ;;
          esac
          echo "Resolved NFL task: $NFL_TASK"
          python scripts/run_public_nfl.py "$NFL_TASK"

  context:
    name: Independent morning NFL injuries and weather
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thomaspyrda/betwise-nfl-matchup-dashboard
          ref: main
          path: nfl
          token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - name: Refresh context independently of results and rankings
        working-directory: nfl
        run: python scripts/run_public_nfl.py context

