name: Repair August 2026 MLB odds gap
on:
  push:
    paths: ['.github/workflows/mlb-august-odds-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover August historical favorite records
        run: |
          mkdir -p data/mlb/audits
          set -o pipefail
          python scripts/repair_mlb_august_2026_odds.py 2>&1 | tee data/mlb/audits/2026-august-repair.txt
      - name: Save recovered games and audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/audits/2026-august-repair.txt
          if [ "${{ job.status }}" = "success" ]; then git add data/mlb/game-results/2026.json; fi
          if ! git diff --cached --quiet; then git commit -m "Recover 2026 August MLB favorites and audit results";git push;fi
