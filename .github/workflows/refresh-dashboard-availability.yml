name: Refresh all dashboard player availability
on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'
      timezone: America/New_York
    - cron: '5 17 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - refresh_dashboard_availability.py
      - tests/test_dashboard_availability.py
      - .github/workflows/refresh-dashboard-availability.yml
permissions:
  contents: write
concurrency:
  group: dashboard-player-availability
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify report freshness and status handling
        run: python -m unittest discover -s tests -p test_dashboard_availability.py
      - name: Refresh current player availability for every sport
        run: python refresh_dashboard_availability.py
      - name: Publish availability independently of statistical snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard-availability
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh sourced player availability for all sport dashboards'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
