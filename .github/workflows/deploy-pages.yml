name: Deploy Match Lab
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate CFB Dashboard foundation", "Refresh NBA Dashboard", "Refresh MLB Dashboard", "Refresh CBB Dashboard", "Build CFB team history"]
    branches: [cfb-dashboard-foundation, main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - data/**
      - cfb/**
      - teams.html
      - sitemap-cfb-teams.xml
      - sitemap.xml
      - mlb/**
      - nba/**
      - cbb/**
      - sports-research/**
      - site-navigation.js
      - site-navigation.css
      - sitemap-sports.xml
      - cfb-dashboard-preview/**
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

