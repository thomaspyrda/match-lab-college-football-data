name: Deploy Match Lab
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate CFB Dashboard foundation", "Refresh NBA Dashboard", "Refresh MLB Dashboard", "Refresh CBB Dashboard", "Build CFB team history", "Refresh FBS Season Leaders", "Build CFB Program Accolades"]
    branches: [cfb-dashboard-foundation, main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - college-football-defensive-strength-rankings/**
      - college-football-offensive-strength-rankings/**
      - college-football-strength-of-schedule-rankings/**
      - college-football-team-strength-rankings/**
      - styles.css
      - app.js
      - data/**
      - cfb/**
      - teams.html
      - sitemap-cfb-teams.xml
      - sitemap.xml
      - mlb/**
      - nba/**
      - cbb/**
      - sports-research/**
      - college-football-season-leaders/**
      - site-navigation-v3.js
      - site-navigation.js
      - site-navigation.css
      - sitemap-sports.xml
      - cfb-dashboard-preview/**
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: true
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


