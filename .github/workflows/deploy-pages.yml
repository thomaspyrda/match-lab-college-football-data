name: Deploy Match Lab
# Includes restored MLB team-page layouts and draft archive updates through 2015.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Recover missing CBB historical ATS and totals", "Backfill CBB linked custom paint archives", "Backfill CBB complete period paint", "Backfill CBB classic HTML paint", "Backfill CBB official WMT paint", "Backfill CBB legacy paint archives", "Backfill CBB official paint archives", "Backfill CBB historical lines and paint", "Backfill CBB historical tournament results", "Validate CFB Dashboard foundation", "Refresh NBA Dashboard", "Build NBA team rankings", "Refresh MLB Dashboard", "Refresh MLB season snapshots", "Refresh CBB Dashboard", "Refresh CBB Conference Standings", "Refresh CBB team archives", "Build CFB team history", "Refresh FBS Season Leaders", "Build CFB Program Accolades"]
    branches: [cfb-dashboard-foundation, main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - college-football-defensive-strength-rankings/**
      - college-football-offensive-strength-rankings/**
      - college-football-strength-of-schedule-rankings/**
      - college-football-team-strength-rankings/**
      - styles.css
      - app.js
      - data/**
      - cfb/**
      - teams.html
      - sitemap-cfb-teams.xml
      - sitemap.xml
      - mlb/**
      - nba/**
      - cbb/**
      - sports-research/**
      - college-football-season-leaders/**
      - site-navigation-v3.js
      - site-navigation-v4.js
      - site-navigation-v10.js
      - site-navigation-v11.js
      - assets/underdog-*
      - site-navigation-v9.js
      - site-navigation-v8.js
      - site-navigation-v7.js
      - site-navigation-v6.js
      - site-navigation-v5.js
      - scripts/normalize_site_navigation.py
      - site-navigation.js
      - site-navigation.css
      - sitemap-sports.xml
      - cfb-dashboard-preview/**
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish consistent navigation on all pages
        run: |
          python3 scripts/normalize_site_navigation.py
          python3 scripts/normalize_site_navigation.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

