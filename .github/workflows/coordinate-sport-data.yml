name: Ordered Active Sports Morning Update
run-name: "${{ inputs.sport || 'active sports morning' }} data pipeline"
# Ordered morning runs; existing afternoon and source-specific schedules remain enabled.
# Existing Python models, HTML, CSS and JSON schemas are intentionally unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/coordinate-sport-data.yml']
  repository_dispatch:
    types: [morning-refresh]
  schedule:
    - cron: '30 2 * * *'
      timezone: America/New_York
    - cron: '15 3 * * *'
      timezone: America/New_York
    - cron: '0,40 4 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      sport:
        description: 'Run one sport pipeline; independent injury jobs remain separately scheduled'
        type: choice
        required: true
        options: [cbb, nba, cfb, mlb]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: ordered-morning-publication
  cancel-in-progress: false
jobs:
  morning-start:
    name: Morning recovery entry point
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start ordered publication and dependent jobs
        run: date -u

  morning-availability:
    needs: [morning-start]
    if: inputs.sport != 'mlb'
    uses: ./.github/workflows/refresh-dashboard-availability.yml
    secrets: inherit

  cbb-results-and-team-archives:
    needs: [morning-start]
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/cbb-team-archives.yml
    secrets: inherit

  cbb-box-scores:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-results-and-team-archives]
    uses: ./.github/workflows/refresh-cbb-boxes.yml
    secrets: inherit

  cbb-player-statistics:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-box-scores]
    uses: ./.github/workflows/refresh-cbb-players.yml
    secrets: inherit

  cbb-team-metrics:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-box-scores]
    uses: ./.github/workflows/refresh-cbb-metrics.yml
    secrets: inherit

  cbb-rosters:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-results-and-team-archives]
    uses: ./.github/workflows/refresh-cbb-rosters.yml
    secrets: inherit

  cbb-market-capture:
    needs: [morning-start]
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/cbb-pregame-market-capture.yml
    secrets: inherit

  cbb-market-publication:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-market-capture, cbb-dashboard]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/cbb-publish-markets.yml
    secrets: inherit

  cbb-rankings-and-strength:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-team-metrics]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-cbb-strength.yml
    secrets: inherit

  cbb-metric-rankings:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-team-metrics]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-cbb-metric-ranks.yml
    secrets: inherit

  cbb-season-leaders:
    if: (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-player-statistics]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-cbb-season-leaders.yml
    secrets: inherit

  cbb-team-publication:
    if: always() && (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push') && needs.cbb-results-and-team-archives.result == 'success'
    needs: [cbb-results-and-team-archives, cbb-team-metrics, cbb-player-statistics, cbb-rosters]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/cbb-publish-team-pages.yml
    secrets: inherit

  cbb-dashboard:
    if: always() && (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push') && needs.cbb-results-and-team-archives.result == 'success'
    needs: [cbb-results-and-team-archives, cbb-box-scores, cbb-player-statistics, cbb-rosters]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-cbb-dashboard.yml
    secrets: inherit

  nba-verified-statistics-and-pages:
    needs: [morning-start, morning-availability]
    if: always() && needs.morning-start.result == 'success' && (inputs.sport == 'nba' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/refresh-nba-dashboard.yml
    secrets: inherit

  nba-current-leaders:
    if: (inputs.sport == 'nba' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [nba-verified-statistics-and-pages]
    uses: ./.github/workflows/publish-nba-leaders.yml
    secrets: inherit

  cfb-results:
    needs: [morning-start]
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/refresh-cfb-results.yml
    secrets: inherit

  cfb-markets:
    needs: [morning-start]
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/refresh-cfb-markets.yml
    secrets: inherit

  cfb-market-publication:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-markets]
    uses: ./.github/workflows/cfb-publish-markets.yml
    secrets: inherit

  cfb-team-metrics:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/refresh-cfb-metrics.yml
    secrets: inherit

  cfb-player-statistics:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/refresh-cfb-players.yml
    secrets: inherit

  cfb-dashboard-strength:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/refresh-cfb-strength.yml
    secrets: inherit

  cfb-context:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results, morning-availability]
    uses: ./.github/workflows/refresh-cfb-context.yml
    secrets: inherit

  cfb-team-metadata:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/refresh-cfb-metadata.yml
    secrets: inherit

  cfb-team-strength:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/build-team-strength.yml
    secrets: inherit

  cfb-player-season-leaders:
    if: (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results]
    uses: ./.github/workflows/refresh-fbs-leaders.yml
    secrets: inherit

  cfb-team-pages:
    if: always() && (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push') && needs.cfb-results.result == 'success'
    needs: [cfb-results, cfb-team-metrics, cfb-player-statistics, cfb-team-metadata]
    uses: ./.github/workflows/build-cfb-team-pages.yml
    secrets: inherit

  cfb-dashboard:
    if: always() && (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push') && needs.cfb-results.result == 'success'
    needs: [cfb-results, cfb-team-metrics, cfb-player-statistics, cfb-dashboard-strength]
    uses: ./.github/workflows/cfb-publish-dashboard.yml
    secrets: inherit

  mlb-current-season-dashboard:
    if: inputs.sport == 'mlb'
    uses: ./.github/workflows/refresh-mlb-dashboard.yml
    secrets: inherit

  validate-cbb-datasets:
    name: Validate CBB result and publication inputs
    if: always() && (inputs.sport == 'cbb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cbb-results-and-team-archives, cbb-box-scores, cbb-player-statistics, cbb-team-metrics, cbb-rosters, cbb-rankings-and-strength, cbb-metric-rankings, cbb-season-leaders, cbb-team-publication, cbb-dashboard, cbb-market-publication]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 scripts/verify_sport_dataset_contract.py --sport cbb
          python3 scripts/verify_cbb_pipeline.py

  validate-nba-datasets:
    name: Validate NBA result and publication inputs
    if: (inputs.sport == 'nba' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [nba-verified-statistics-and-pages, nba-current-leaders]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/verify_sport_dataset_contract.py --sport nba

  validate-cfb-datasets:
    name: Validate CFB result and publication inputs
    if: always() && (inputs.sport == 'cfb' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push')
    needs: [cfb-results, cfb-team-metrics, cfb-player-statistics, cfb-dashboard-strength, cfb-team-strength, cfb-player-season-leaders, cfb-team-pages, cfb-dashboard, cfb-context, cfb-market-publication]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 scripts/verify_sport_dataset_contract.py --sport cfb
          python3 scripts/verify_cfb_pipeline.py

  validate-mlb-datasets:
    name: Validate MLB result and publication inputs
    if: inputs.sport == 'mlb'
    needs: [mlb-current-season-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/verify_sport_dataset_contract.py --sport mlb




  deploy-morning:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.sport != 'mlb')
    needs: [validate-cbb-datasets, validate-nba-datasets, validate-cfb-datasets, morning-availability]
    uses: ./.github/workflows/deploy-pages.yml

  verify-live-morning:
    needs: [deploy-morning]
    if: always() && needs.deploy-morning.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/verify_morning_publication.py --sport "${{ inputs.sport || 'all' }}"
