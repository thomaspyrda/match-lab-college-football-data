name: Ordered Active Sports Morning Update
run-name: ${{ inputs.backup && 'morning backup data pipeline' || 'morning daily data pipeline' }}
'on':
  workflow_dispatch:
    inputs:
      sport:
        type: choice
        required: true
        default: all
        options:
        - all
        - nba
        - cbb
        - cfb
        - nfl
      backup:
        description: Retry unfinished source statistics without paid market collection
        type: boolean
        default: false
      morning_date:
        description: Eastern date supplied by the scheduled launcher
        type: string
        required: false
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: ordered-morning-publication
  cancel-in-progress: false
  queue: max
jobs:
  morning-start:
    name: Check authoritative sources before scheduling calculations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      morning_date: ${{ steps.window.outputs.morning_date }}
      nba: ${{ steps.plan.outputs.nba }}
      cbb: ${{ steps.plan.outputs.cbb }}
      cfb: ${{ steps.plan.outputs.cfb }}
      nfl: ${{ steps.plan.outputs.nfl }}
      nfl_leaders: ${{ steps.plan.outputs.nfl_leaders }}
    env:
      MORNING_DATE: ${{ inputs.morning_date }}
    steps:
    - name: Enforce the current Eastern morning window
      id: window
      shell: python
      run: |
        from datetime import datetime
        from zoneinfo import ZoneInfo
        import os

        local = datetime.now(ZoneInfo("America/New_York"))
        expected_date = os.environ.get("MORNING_DATE")
        cutoff_hour = 17 if expected_date == "2026-11-27" else 11
        if not 2 <= local.hour < cutoff_hour or (expected_date and expected_date != str(local.date())):
            raise SystemExit("Outside the current 02:00–11:00 Eastern publication window.")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"morning_date={local.date()}\n")
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/checkout@v4
      with:
        repository: thomaspyrda/betwise-nfl-matchup-dashboard
        ref: main
        path: .sources/nfl
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        persist-credentials: false
    - name: Verify daily source-check and watermark rules
      run: python3 -m unittest discover -s tests -p test_daily_work_plan.py -v
    - id: plan
      env:
        CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      run: python3 scripts/daily_work_plan.py
    - name: Save source-check receipt without changing statistics timestamps
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add data/automation/daily-plan.json
        git diff --cached --quiet && exit 0
        git commit -m 'Record verified daily source check'
        git pull --rebase origin main
        git push origin HEAD:main
  morning-availability:
    if: inputs.backup != true || needs.morning-start.outputs.cfb == 'true' || needs.morning-start.outputs.nfl == 'true'
    needs:
    - morning-start
    uses: ./.github/workflows/refresh-dashboard-availability.yml
    secrets: inherit
  cbb-results-and-team-archives:
    needs:
    - morning-start
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.morning-start.result
      == 'success'
    uses: ./.github/workflows/cbb-team-archives.yml
    secrets: inherit
  cbb-box-scores:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-results-and-team-archives.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-results-and-team-archives
    - morning-start
    uses: ./.github/workflows/refresh-cbb-boxes.yml
    secrets: inherit
  cbb-player-statistics:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-box-scores.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-box-scores
    - morning-start
    uses: ./.github/workflows/refresh-cbb-players.yml
    secrets: inherit
  cbb-team-metrics:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-box-scores.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-box-scores
    - morning-start
    uses: ./.github/workflows/refresh-cbb-metrics.yml
    secrets: inherit
  cbb-rosters:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-results-and-team-archives.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-results-and-team-archives
    - morning-start
    uses: ./.github/workflows/refresh-cbb-rosters.yml
    secrets: inherit
  cbb-market-capture:
    needs:
    - morning-start
    if: (inputs.backup != true) && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb')
    uses: ./.github/workflows/cbb-pregame-market-capture.yml
    secrets: inherit
  cbb-market-publication:
    if: always() && needs.cbb-market-capture.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.cbb-dashboard.result)
    needs:
    - cbb-market-capture
    - cbb-dashboard
    - morning-start
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/cbb-publish-markets.yml
    secrets: inherit
  cbb-rankings-and-strength:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-team-metrics.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-team-metrics
    - morning-start
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-cbb-strength.yml
    secrets: inherit
  cbb-metric-rankings:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-team-metrics.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-team-metrics
    - morning-start
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-cbb-metric-ranks.yml
    secrets: inherit
  cbb-season-leaders:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-player-statistics.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cbb-player-statistics
    - morning-start
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-cbb-season-leaders.yml
    secrets: inherit
  cbb-team-publication:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-results-and-team-archives.result
      == 'success' && needs.cbb-team-metrics.result == 'success' && needs.cbb-player-statistics.result == 'success' && needs.cbb-rosters.result
      == 'success' && needs.morning-start.result == 'success' && needs.cbb-rankings-and-strength.result == 'success' && needs.cbb-metric-rankings.result
      == 'success' && needs.cbb-dependent-summary.result == 'success'
    needs:
    - cbb-results-and-team-archives
    - cbb-team-metrics
    - cbb-player-statistics
    - cbb-rosters
    - morning-start
    - cbb-rankings-and-strength
    - cbb-metric-rankings
    - cbb-dependent-summary
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/cbb-publish-team-pages.yml
    secrets: inherit
  cbb-dashboard:
    if: always() && (inputs.backup != true || needs.morning-start.outputs.cbb == 'true') && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && (needs.morning-start.outputs.cbb
      == 'false' || needs.cbb-results-and-team-archives.result == 'success') && contains(fromJSON('["success","skipped"]'), needs.cbb-results-and-team-archives.result)
      && contains(fromJSON('["success","skipped"]'), needs.cbb-box-scores.result) && contains(fromJSON('["success","skipped"]'), needs.cbb-player-statistics.result)
      && contains(fromJSON('["success","skipped"]'), needs.cbb-rosters.result)
    needs:
    - cbb-results-and-team-archives
    - cbb-box-scores
    - cbb-player-statistics
    - cbb-rosters
    - morning-start
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-cbb-dashboard.yml
    secrets: inherit
  nba-rosters:
    needs:
    - morning-start
    if: (inputs.backup != true || needs.morning-start.outputs.nba == 'true') && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba')
    uses: ./.github/workflows/refresh-nba-rosters.yml
    secrets: inherit
  nba-availability:
    needs:
    - morning-start
    if: (inputs.backup != true || needs.morning-start.outputs.nba == 'true') && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba')
    uses: ./.github/workflows/refresh-nba-availability.yml
    secrets: inherit
  nba-verified-statistics-and-pages:
    needs:
    - morning-start
    - nba-rosters
    - nba-availability
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba') && needs.morning-start.outputs.nba == 'true' && needs.morning-start.result
      == 'success' && needs.nba-rosters.result == 'success' && needs.nba-availability.result == 'success'
    uses: ./.github/workflows/refresh-nba-dashboard.yml
    secrets: inherit
  nba-current-leaders:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba') && needs.morning-start.outputs.nba == 'true' && needs.nba-verified-statistics-and-pages.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - nba-verified-statistics-and-pages
    - morning-start
    uses: ./.github/workflows/publish-nba-leaders.yml
    secrets: inherit
  nba-full-schedules:
    if: always() && (inputs.backup != true || needs.morning-start.outputs.nba == 'true') && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba') && contains(fromJSON('["success","skipped"]'),
      needs.nba-verified-statistics-and-pages.result)
    needs:
    - nba-verified-statistics-and-pages
    - morning-start
    uses: ./.github/workflows/refresh-nba-schedules.yml
    secrets: inherit
  cfb-results:
    needs:
    - morning-start
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.morning-start.result
      == 'success'
    uses: ./.github/workflows/refresh-cfb-results.yml
    secrets: inherit
  cfb-markets:
    needs:
    - morning-start
    if: (inputs.backup != true) && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb')
    uses: ./.github/workflows/refresh-cfb-markets.yml
    secrets: inherit
  cfb-market-publication:
    if: always() && needs.cfb-markets.result == 'success' && needs.cfb-context.result == 'success' && needs.cfb-dashboard.result == 'success'
    needs:
    - cfb-markets
    - cfb-context
    - cfb-dashboard
    uses: ./.github/workflows/cfb-publish-markets.yml
    secrets: inherit
  cfb-team-metrics:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/refresh-cfb-metrics.yml
    secrets: inherit
  cfb-player-statistics:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/refresh-cfb-players.yml
    secrets: inherit
  cfb-dashboard-strength:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/refresh-cfb-strength.yml
    secrets: inherit
  cfb-context:
    if: always() && (inputs.backup != true || needs.morning-start.outputs.cfb == 'true') && needs.morning-start.result == 'success' && needs.morning-availability.result == 'success' && contains(fromJSON('["success","skipped"]'),
      needs.cfb-results.result) && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb')
    needs:
    - morning-start
    - morning-availability
    - cfb-results
    uses: ./.github/workflows/refresh-cfb-context.yml
    secrets: inherit
  cfb-team-metadata:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/refresh-cfb-metadata.yml
    secrets: inherit
  cfb-team-strength:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/build-team-strength.yml
    secrets: inherit
  cfb-player-season-leaders:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - morning-start
    uses: ./.github/workflows/refresh-fbs-leaders.yml
    secrets: inherit
  cfb-team-pages:
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.cfb-team-metrics.result == 'success' && needs.cfb-player-statistics.result == 'success' && needs.cfb-team-metadata.result
      == 'success' && needs.morning-start.result == 'success' && needs.cfb-team-strength.result == 'success'
    needs:
    - cfb-results
    - cfb-team-metrics
    - cfb-player-statistics
    - cfb-team-metadata
    - morning-start
    - cfb-team-strength
    uses: ./.github/workflows/build-cfb-team-pages.yml
    secrets: inherit
  cfb-dashboard:
    if: always() && (inputs.backup != true || needs.morning-start.outputs.cfb == 'true') && needs.cfb-context.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.cfb-results.result) && contains(fromJSON('["success","skipped"]'),
      needs.cfb-team-metrics.result) && contains(fromJSON('["success","skipped"]'), needs.cfb-player-statistics.result) && contains(fromJSON('["success","skipped"]'),
      needs.cfb-dashboard-strength.result)
    needs:
    - morning-start
    - cfb-results
    - cfb-team-metrics
    - cfb-player-statistics
    - cfb-dashboard-strength
    - cfb-context
    uses: ./.github/workflows/cfb-publish-dashboard.yml
    secrets: inherit
  validate-cbb-datasets:
    name: Validate CBB result and publication inputs
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cbb') && needs.morning-start.outputs.cbb == 'true' && needs.cbb-results-and-team-archives.result
      == 'success' && needs.cbb-box-scores.result == 'success' && needs.cbb-player-statistics.result == 'success' && needs.cbb-team-metrics.result
      == 'success' && needs.cbb-rosters.result == 'success' && needs.cbb-rankings-and-strength.result == 'success' && needs.cbb-metric-rankings.result
      == 'success' && needs.cbb-season-leaders.result == 'success' && needs.cbb-team-publication.result == 'success' && needs.cbb-dashboard.result
      == 'success' && (inputs.backup || needs.cbb-market-publication.result == 'success') && needs.morning-start.result == 'success' && needs.cbb-dependent-summary.result
      == 'success'
    needs:
    - cbb-results-and-team-archives
    - cbb-box-scores
    - cbb-player-statistics
    - cbb-team-metrics
    - cbb-rosters
    - cbb-rankings-and-strength
    - cbb-metric-rankings
    - cbb-season-leaders
    - cbb-team-publication
    - cbb-dashboard
    - cbb-market-publication
    - morning-start
    - cbb-dependent-summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: |
        python3 scripts/verify_sport_dataset_contract.py --sport cbb
        python3 scripts/verify_cbb_pipeline.py
  validate-nba-datasets:
    name: Validate NBA result and publication inputs
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nba') && needs.morning-start.outputs.nba == 'true' && needs.nba-verified-statistics-and-pages.result
      == 'success' && needs.nba-current-leaders.result == 'success' && needs.nba-full-schedules.result == 'success' && needs.morning-start.result
      == 'success' && needs.nba-dependent-summary.result == 'success'
    needs:
    - nba-verified-statistics-and-pages
    - nba-current-leaders
    - nba-full-schedules
    - morning-start
    - nba-dependent-summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: python3 scripts/verify_sport_dataset_contract.py --sport nba
  validate-cfb-datasets:
    name: Validate CFB result and publication inputs
    if: always() && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'cfb') && needs.morning-start.outputs.cfb == 'true' && needs.cfb-results.result
      == 'success' && needs.cfb-team-metrics.result == 'success' && needs.cfb-player-statistics.result == 'success' && needs.cfb-dashboard-strength.result
      == 'success' && needs.cfb-team-strength.result == 'success' && needs.cfb-player-season-leaders.result == 'success' && needs.cfb-team-pages.result
      == 'success' && needs.cfb-dashboard.result == 'success' && needs.cfb-context.result == 'success' && (inputs.backup || needs.cfb-market-publication.result == 'success') && needs.morning-start.result == 'success'
    needs:
    - cfb-results
    - cfb-team-metrics
    - cfb-player-statistics
    - cfb-dashboard-strength
    - cfb-team-strength
    - cfb-player-season-leaders
    - cfb-team-pages
    - cfb-dashboard
    - cfb-context
    - cfb-market-publication
    - morning-start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: |
        python3 scripts/verify_sport_dataset_contract.py --sport cfb
        python3 scripts/verify_cfb_pipeline.py
  verify-live-morning:
    name: Validate source readiness for WiseStats handoff
    needs:
    - record-completed-inputs
    if: always() && needs.record-completed-inputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: python3 scripts/verify_morning_publication.py --sport "${{ inputs.sport == 'nfl' && 'all' || inputs.sport || 'all' }}" --source-only
  nba-dependent-summary:
    needs:
    - nba-verified-statistics-and-pages
    uses: ./.github/workflows/refresh-nba-defense.yml
    secrets: inherit
  cbb-dependent-summary:
    needs:
    - cbb-results-and-team-archives
    uses: ./.github/workflows/refresh-cbb-conference-standings.yml
    secrets: inherit
  nfl-context:
    needs:
    - morning-availability
    - morning-start
    if: always() && (inputs.backup != true || needs.morning-start.outputs.nfl == 'true') && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nfl') && contains(fromJSON('["success","skipped"]'),
      needs.morning-availability.result)
    uses: ./.github/workflows/run-nfl-public.yml
    with:
      task: context
    secrets: inherit
  nfl-statistics:
    needs:
    - morning-start
    if: always() && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nfl') && needs.morning-start.outputs.nfl
      == 'true'
    uses: ./.github/workflows/run-nfl-public.yml
    with:
      task: statistics
    secrets: inherit
  nfl-leaders:
    needs:
    - nfl-statistics
    - morning-start
    if: always() && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nfl') && needs.morning-start.outputs.nfl_leaders
      == 'true' && contains(fromJSON('["success","skipped"]'), needs.nfl-statistics.result)
    uses: ./.github/workflows/run-nfl-public.yml
    with:
      task: leaders
    secrets: inherit
  nfl-markets:
    needs:
    - nfl-context
    - nfl-statistics
    - morning-start
    if: always() && (inputs.backup != true) && needs.morning-start.result == 'success' && (inputs.sport == 'all' || inputs.sport == '' || inputs.sport == 'nfl') && contains(fromJSON('["success","skipped"]'),
      needs.nfl-context.result) && contains(fromJSON('["success","skipped"]'), needs.nfl-statistics.result)
    uses: ./.github/workflows/run-nfl-public.yml
    with:
      task: markets
    secrets: inherit
  record-completed-inputs:
    needs:
    - validate-nba-datasets
    - validate-cbb-datasets
    - validate-cfb-datasets
    - nfl-statistics
    - nfl-leaders
    - nfl-context
    - nfl-markets
    - morning-start
    - nba-live-markets
    if: always() && needs.morning-start.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - env:
        SPORT_RESULTS: '{"nba": "${{ needs.validate-nba-datasets.result }}", "cbb": "${{ needs.validate-cbb-datasets.result }}", "cfb": "${{ needs.validate-cfb-datasets.result
          }}", "nfl": "${{ needs.nfl-statistics.result }}"}'
      run: |
        python3 scripts/daily_work_plan.py --checkpoint
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add data/automation/daily-watermarks.json data/daily-readiness.json
        git diff --cached --quiet && exit 0
        git commit -m 'Checkpoint only successfully completed sport inputs'
        git pull --rebase origin main
        git push origin HEAD:main
  publish-verified-site:
    needs:
    - morning-start
    - verify-live-morning
    - record-completed-inputs
    if: always() && needs.record-completed-inputs.result == 'success'
    uses: ./.github/workflows/publish-wisestats-public.yml
    with:
      morning_date: ${{ needs.morning-start.outputs.morning_date }}
    secrets: inherit
  nba-live-markets:
    needs:
    - nba-verified-statistics-and-pages
    - nba-availability
    if: always() && (inputs.backup != true) && needs.nba-availability.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.nba-verified-statistics-and-pages.result)
    uses: ./.github/workflows/refresh-nba-markets.yml
    secrets: inherit
  start-prop-research:
    name: Start Prop Lab after verified live source publication
    needs:
    - publish-verified-site
    if: always() && (inputs.backup != true) && needs.publish-verified-site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - name: Dispatch current research with its verified parent run
      env:
        GH_TOKEN: ${{ github.token }}
        PARENT_RUN: ${{ github.run_id }}
        MORNING_DATE: ${{ inputs.morning_date }}
        REPOSITORY: ${{ github.repository }}
      shell: python
      run: |
        from datetime import datetime
        from zoneinfo import ZoneInfo
        import os

        local = datetime.now(ZoneInfo("America/New_York"))
        expected_date = os.environ.get("MORNING_DATE")
        cutoff_hour = 17 if expected_date == "2026-11-27" else 11
        if not 2 <= local.hour < cutoff_hour or (expected_date and expected_date != str(local.date())):
            raise SystemExit("Outside the current 02:00–11:00 Eastern publication window.")
        import json, urllib.request
        url='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/workflows/prop-lab-scheduled.yml/dispatches'
        body=json.dumps({'ref':'main','inputs':{'collect_missing':True,'parent_run_id':os.environ['PARENT_RUN']}}).encode()
        headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
        with urllib.request.urlopen(urllib.request.Request(url,data=body,headers=headers,method='POST'),timeout=30) as response:
            if response.status!=204:raise SystemExit('Prop Lab start was not accepted')
        print('Prop Lab dispatched after successful live source verification.')
