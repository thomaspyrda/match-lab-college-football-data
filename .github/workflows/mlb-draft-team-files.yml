name: Publish MLB draft classes 2015–2026
on:
  push:
    branches: [main]
    paths:
      - build_mlb_draft_team_files.py
      - .github/workflows/mlb-draft-team-files.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Populate complete official draft classes
        run: python -u build_mlb_draft_team_files.py
      - name: Validate every published team file
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.load(open('data/mlb/draft-publish-status.json'))
          for year,result in d['seasons'].items():
              if result['status']!='published':continue
              files=list(pathlib.Path('data/mlb/drafts',year).glob('*.json'))
              assert len(files)==30,(year,len(files))
              total=sum(len(json.load(open(p))['picks']) for p in files)
              assert total==result['pick_count'],(year,total)
          PY
      - name: Commit team draft files and verification report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/drafts data/mlb/draft-publish-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(mlb): publish official draft classes 2015–2026'
          git pull --rebase -X theirs origin main
          git push origin main
