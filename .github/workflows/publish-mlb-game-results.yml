name: Publish MLB historical game results
on:
  workflow_dispatch:
  schedule:
    - cron: '35 11 * * *'
  push:
    branches: [main]
    paths:
      - 'build_mlb_game_results.py'
      - '.github/workflows/publish-mlb-game-results.yml'
permissions:
  contents: write
concurrency:
  group: publish-mlb-game-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate MLB game-result handling
        run: python -m unittest discover -s tests -p 'test_build_mlb_game_results.py' -v
      - name: Backfill 2015-2026 official regular-season finals
        run: python build_mlb_game_results.py --years 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026
      - name: Validate season records against published official snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshots=json.loads(Path('data/mlb/season-snapshots.json').read_text())['seasons']
          mismatches=[]
          for year in range(2015,2027):
              doc=json.loads(Path(f'data/mlb/game-results/{year}.json').read_text())
              for slug,data in doc['teams'].items():
                  reference=snapshots[str(year)][slug]
                  for field in ('wins','losses'):
                      actual=data['record'][field]
                      expected=reference[field]
                      if actual != expected:
                          mismatches.append({'season':year,'team':slug,'field':field,'actual':actual,'expected':expected})
                  actual=len(data['games'])
                  expected=reference['games_played']
                  if actual != expected:
                      mismatches.append({'season':year,'team':slug,'field':'games_played','actual':actual,'expected':expected})
          report={'mismatches':mismatches,'mismatch_count':len(mismatches)}
          Path('mlb-historical-backfill-validation.json').write_text(json.dumps(report,indent=2))
          if mismatches:
              print('Historical backfill discrepancies (first 30):')
              print(json.dumps(mismatches[:30],indent=2))
              raise SystemExit(f'{len(mismatches)} season/team discrepancies; no publication')
          print('MLB histories reconciled against season snapshots for all 30 teams.')
          PY
      - name: Preserve backfill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-backfill-diagnostics
          path: |
            mlb-historical-backfill-validation.json
            data/mlb/game-results/
          retention-days: 7
      - name: Commit validated MLB game-history data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/game-results/
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated MLB 2015-2026 historical game results"
          git pull --rebase -X theirs origin main
          git push origin main
