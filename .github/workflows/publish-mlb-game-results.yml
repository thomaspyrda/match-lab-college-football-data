name: Publish MLB historical game results
on:
  workflow_dispatch:
  schedule:
    - cron: '35 11 * * *'
  push:
    branches: [main]
    paths:
      - 'build_mlb_game_results.py'
      - '.github/workflows/publish-mlb-game-results.yml'
permissions:
  contents: write
concurrency:
  group: publish-mlb-game-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate MLB game-result handling
        run: python -m unittest discover -s tests -p 'test_build_mlb_game_results.py' -v
      - name: Backfill 2015-2026 official regular-season finals
        run: python build_mlb_game_results.py --years 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026
      - name: Validate game histories against MLB official standings
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from build_mlb_season_snapshots import IDS
          report={'seasons':{},'warnings':[],'publishable':[]}
          for year in range(2015,2027):
              doc=json.loads(Path(f'data/mlb/game-results/{year}.json').read_text())
              url=f'https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season={year}&standingsTypes=regularSeason'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BetWiseResearch/1.0'}),timeout=90) as resp:
                  standings=json.load(resp)
              official={}
              for division in standings.get('records',[]):
                  for row in division.get('teamRecords',[]):
                      tid=row.get('team',{}).get('id')
                      if tid in IDS: official[IDS[tid]]=(int(row['wins']),int(row['losses']))
              if len(official)!=30:
                  raise SystemExit(f'{year}: MLB standings returned {len(official)} of 30 teams')
              expected=sum(sum(v) for v in official.values())
              actual=sum(d['record']['wins']+d['record']['losses'] for d in doc['teams'].values())
              coverage=actual/expected if expected else 0
              errors=[]
              for slug,data in doc['teams'].items():
                  got=data['record']
                  ow,ol=official[slug]
                  if got['wins']>ow or got['losses']>ol:
                      errors.append({'team':slug,'error':'more W-L than official','actual':[got['wins'],got['losses']],'official':[ow,ol]})
                  if any(g.get('result') not in ('W','L','T','Cancelled','Postponed','Suspended','Scheduled','Final — score unavailable') for g in data['games']):
                      errors.append({'team':slug,'error':'unknown game status'})
                  if len({g['game_id'] for g in data['games']})!=len(data['games']):
                      errors.append({'team':slug,'error':'duplicate game ID'})
              report['seasons'][str(year)]={'coverage':round(coverage,6),'completed_appearances':actual,'official_appearances':expected,'quarantined':len(doc['quarantined']),'errors':errors}
              # The current season must be complete; historical seasons may have <=1% missing finals.
              minimum=1.0 if year==2026 else .99
              if coverage<minimum or errors:
                  report['warnings'].append({'year':year,'coverage':coverage,'errors':errors[:10]})
                  Path(f'data/mlb/game-results/{year}.json').unlink()
              else:
                  report['publishable'].append(year)
          Path('mlb-historical-backfill-validation.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report['seasons'],indent=2))
          if report['warnings']:
              print('Seasons withheld from publication:',json.dumps(report['warnings']))
          if not report['publishable']:
              raise SystemExit('No season met official validation thresholds')
          print('Publishable MLB seasons:',report['publishable'])
          PY
      - name: Preserve backfill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-historical-backfill-diagnostics
          path: |
            mlb-historical-backfill-validation.json
            data/mlb/game-results/
          retention-days: 7
      - name: Commit validated MLB game-history data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/game-results/ mlb-historical-backfill-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish MLB validated seasons and coverage report"
          git pull --rebase -X theirs origin main
          git push origin main
