name: Notify WiseStats publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify the independent WiseStats publisher
        env:
          WISESTATS_PUBLISH_TOKEN: ${{ secrets.WISESTATS_PUBLISH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'push' }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        shell: python
        run: |
          import json, os, urllib.request
          token = os.environ.get('WISESTATS_PUBLISH_TOKEN', '')
          if not token:
              raise SystemExit('Set WISESTATS_PUBLISH_TOKEN with Contents write access to wisestats-site before enabling this workflow.')
          body = json.dumps({'event_type': 'sports-publication', 'client_payload': {'source_repository': os.environ['SOURCE_REPOSITORY'], 'source_conclusion': os.environ['SOURCE_CONCLUSION'], 'source_run_url': os.environ['SOURCE_RUN_URL']}}).encode()
          request = urllib.request.Request('https://api.github.com/repos/thomaspyrda/wisestats-site/dispatches', data=body, method='POST', headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204: raise SystemExit('WiseStats publication request failed')
          print('WiseStats build requested. Its build and live publication must be checked separately.')
