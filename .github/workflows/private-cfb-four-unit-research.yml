name: Private CFB four unit research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-cfb-four-unit-research.yml
      - research_four_unit_nonrecursive_2026.py
      - research_sos_strong_comparison_2026.py
      - research_sos_asymmetric_comparison_2026.py
      - research_sos_loss_penalties_2026.py
      - research_margin_uncapped_15_2026.py
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate experimental four unit ratings (stdout only)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python research_four_unit_nonrecursive_2026.py
      - name: Compare strong SOS adjustment (stdout only)
        run: python research_sos_strong_comparison_2026.py
      - name: Compare asymmetric SOS adjustment (stdout only)
        run: python research_sos_asymmetric_comparison_2026.py
      - name: Compare loss penalties with asymmetric SOS (stdout only)
        run: python research_sos_loss_penalties_2026.py
      - name: Compare uncapped 15 percent scoring margin (stdout only)
        run: python research_margin_uncapped_15_2026.py
