name: Publish split MLB draft team data
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mlb-draft-split-teams.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and split data for website
        run: |
          python - <<'PY'
          import json,pathlib
          master=pathlib.Path('data/mlb/draft-classes.json')
          raw=master.read_bytes()
          assert len(raw)>40000,('Empty/short draft file',len(raw))
          data=json.loads(raw)
          teams=data['years']['2025']
          assert len(teams)==30
          count=0
          for slug,entries in teams.items():
              assert entries and all(x.get('player') and x.get('overall_pick') for x in entries),slug
              p=pathlib.Path('data/mlb/drafts/2025')/(slug+'.json')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({'year':2025,'team':slug,'picks':entries},ensure_ascii=False,separators=(',',':'))+'\n')
              count+=len(entries)
          assert count==615,count
          report={'year':2025,'team_count':len(teams),'pick_count':count,'master_bytes':len(raw),'status':'validated_split','example':{'slug':'atlanta-braves','first_pick':teams['atlanta-braves'][0]}}
          pathlib.Path('data/mlb/draft-publication-check.json').write_text(json.dumps(report,indent=2)+'\n')
          print(report)
          PY
      - name: Commit per-team drafts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/drafts/2025 data/mlb/draft-publication-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(mlb): publish 2025 draft class as small per-team pages'
          git pull --rebase -X theirs origin main
          git push origin main
