name: Build MLB Draft Classes
on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"
  push:
    branches: [main]
    paths:
      - build_mlb_draft_classes.py
      - .github/workflows/mlb-draft-classes.yml
permissions:
  contents: write
concurrency:
  group: mlb-draft-classes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect all-round MLB drafts from official records
        run: python -u build_mlb_draft_classes.py || echo "Collector reported failure; recording diagnostics for investigation"
      - name: Check team and season coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          if not Path("data/mlb/draft-classes.json").stat().st_size:
              print("No validated draft years; diagnostic file will be published")
              raise SystemExit(0)
          d=json.load(open("data/mlb/draft-classes.json"))
          assert 1<=len(d["years"])<=7
          for y,teams in d["years"].items():
              assert len(teams)==30,(y,len(teams))
              picks=[p for a in teams.values() for p in a]
              assert len(picks)>=(130 if int(y)==2020 else 450),(y,len(picks))
          PY
      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/draft-classes.json data/mlb/draft-collection-status.json
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): populate historical draft classes"
          git pull --rebase -X theirs origin main
          git push origin main
