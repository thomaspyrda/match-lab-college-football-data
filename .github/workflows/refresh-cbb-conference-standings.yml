name: Refresh CBB Conference Standings
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - backfill_cbb_conference_standings.py
      - data/cbb/regular-season-championships.json
      - tests/test_cbb_conference_standings.py
      - .github/workflows/refresh-cbb-conference-standings.yml
permissions:
  contents: write
concurrency:
  group: cbb-tournament-results
  cancel-in-progress: false
jobs:
  standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check records, tied finishes and championship rules
        run: python -m unittest discover -s tests -p test_cbb_conference_standings.py
      - name: Refresh only the active season; historical seasons remain frozen
        run: python backfill_cbb_conference_standings.py
      - name: Publish conference standings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbb/conference-tournament-results.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(cbb): refresh active-season conference standings'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
