name: Proven competition CPC research
on:
  push:
    branches: [main]
    paths: [run_proven_competition_research.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_proven_competition_research.py
      - name: Save research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/proven_competition_cpc_2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(cfb): save CPC comparison'
          git pull --rebase origin main
          git push origin HEAD:main
