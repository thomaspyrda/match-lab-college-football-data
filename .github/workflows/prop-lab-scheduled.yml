name: Collect private Prop Lab morning research
'on':
  workflow_dispatch:
    inputs:
      collect_missing:
        type: boolean
        default: false
      parent_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: private-prop-lab-collection
  cancel-in-progress: false
jobs:
  collect:
    if: inputs.parent_run_id != '' && inputs.collect_missing == true
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      morning_date: ${{ steps.prerequisites.outputs.morning_date }}
    steps:
    - name: Wait for prerequisite sources and verified live publication
      id: prerequisites
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PARENT_RUN: ${{ inputs.parent_run_id || '' }}
      shell: python
      run: |
        import json, os, time, urllib.request
        from datetime import datetime, timezone
        from zoneinfo import ZoneInfo
        local = datetime.now(ZoneInfo('America/New_York'))
        cutoff_hour = 17 if str(local.date()) == '2026-11-27' else 11
        cutoff = local.replace(hour=cutoff_hour, minute=0, second=0, microsecond=0)
        if not 2 <= local.hour < cutoff_hour:
            raise SystemExit('Outside the Eastern morning window; collection refused.')
        def get(url, github=False):
            headers = {'Cache-Control': 'no-cache', 'User-Agent': 'WiseStats-PropLab-dependency/1'}
            if github: headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
            with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                return json.load(response)
        deadline = time.monotonic() + 5400
        while time.time() < cutoff.timestamp():
            try:
                base = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/actions/workflows/'
                # Wait for active prerequisite writers, not their aggregate conclusion.
                # The research engine independently validates each sport/event's
                # statistics, availability and completed-game coverage before any
                # paid capture; unavailable inputs remain explicit partial results.
                required = ['coordinate-sport-data.yml', 'run-nfl-public.yml', 'publish-wisestats-public.yml']
                for workflow in required:
                    runs = get(base + workflow + '/runs?per_page=100', True)['workflow_runs']
                    if any(r['status'] in ['queued', 'in_progress', 'waiting', 'pending', 'requested'] for r in runs):
                        raise ValueError(workflow + ' is still active')
                parent = os.environ.get('PARENT_RUN')
                parent_url = 'https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs/'+parent
                parent_run = get(parent_url, True)
                parent_date = datetime.fromisoformat(parent_run['created_at'].replace('Z', '+00:00')).astimezone(local.tzinfo).date()
                if (parent_run['head_branch'] != 'main' or parent_run['path'] != '.github/workflows/coordinate-sport-data.yml'
                        or parent_run['display_title'] != 'morning daily data pipeline' or parent_date != local.date()):
                    raise SystemExit('Parent must be today’s main morning coordinator.')
                jobs = get(parent_url+'/jobs?per_page=100', True)['jobs']
                if not any(j['name'].endswith('publish-verified-site / publish') and j['conclusion']=='success' for j in jobs):
                    raise SystemExit('Parent did not verify a live source publication; paid collection refused.')
                host = 'https://wisestats.bet/'
                def live(path): return get(host + path + '?prop_dependency=' + str(time.time_ns()))
                manifest = live('publication-manifest.json')
                assert manifest.get('source_commits', {}).get('sports')
                assert manifest.get('source_commits', {}).get('nfl')
                assert manifest.get('publisher_commit')
                print('Prerequisite workflows completed and current data is live; starting Prop Lab.')
                break
            except Exception as exc:
                print('Waiting for source dependency:', type(exc).__name__, str(exc), flush=True)
                if time.monotonic() >= deadline:
                    raise SystemExit('Sources/publication not ready; collection and release writing were not started.')
                time.sleep(min(60, max(0, cutoff.timestamp() - time.time())))
        else:
            raise SystemExit('Eastern cutoff reached while waiting for verified sources.')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'WISESTATS_MORNING_CUTOFF={int(cutoff.timestamp())}\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'morning_date={local.date()}\n')
    - name: Check existing secrets
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        PRIVATE_TOKEN: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
      shell: python
      run: |
        import os
        if not os.environ.get('ODDS_API_KEY') or not os.environ.get('PRIVATE_TOKEN'):
            raise SystemExit('ODDS_API_KEY and WISESTATS_AUTOMATION_TOKEN are required')
    - name: Checkout private processing and durable scan state
      uses: actions/checkout@v4
      with:
        repository: thomaspyrda/wisestats-site
        ref: prop-lab-private-research
        token: ${{ secrets.WISESTATS_AUTOMATION_TOKEN }}
        path: private
    - name: Restore public statistics cache (never credentials or odds)
      uses: actions/cache@v4
      with:
        path: private/.prop-source-cache
        key: prop-lab-public-stats-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: prop-lab-public-stats-
    - name: Configure private data checkpoint author
      working-directory: private
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
    - name: Validate scan windows, morning source freshness and replay protection
      working-directory: private
      run: python3 -m unittest discover -s prop_lab_runtime -p 'test_*.py' -v
    - name: Collect once per game per Eastern date and build research
      working-directory: private
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        remaining=$((WISESTATS_MORNING_CUTOFF - $(date +%s) - 5))
        if (( remaining <= 0 )); then
          echo 'Eastern cutoff reached before collection.'
          exit 1
        fi
        timeout --kill-after=5s "${remaining}s" python3 prop_lab_runtime/collector.py

  publish-verified-research:
    name: Publish and verify completed Prop Lab research
    needs: collect
    uses: ./.github/workflows/publish-wisestats-public.yml
    with:
      morning_date: ${{ needs.collect.outputs.morning_date }}
    secrets: inherit
