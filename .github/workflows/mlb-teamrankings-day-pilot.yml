name: TeamRankings historical MLB day pilot
on:
  push:
    paths:
      - '.github/workflows/mlb-teamrankings-day-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historical-day:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract historical day matchups
        run: |
          python scripts/teamrankings_day_urls.py
          python scripts/collect_teamrankings_mlb.py --urls data/mlb/teamrankings-2018-day-urls.txt --output data/mlb/teamrankings-2018-day-pilot.json --limit 20 --delay 2
      - name: Save pilot evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/teamrankings-2018-day-urls.txt data/mlb/teamrankings-2018-day-pilot.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record historical TeamRankings 2018 day batch"
            git push
          fi
