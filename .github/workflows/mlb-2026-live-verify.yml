name: Verify published 2026 MLB workbook schedule
on:
  push:
    paths: ['.github/workflows/mlb-2026-live-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Compare repository against live 2026 odds feed
        run: |
          python - <<'PY' | tee /tmp/2026-live.txt
          import json,urllib.request
          from collections import Counter
          def count(d):
              rows=[g for t in d['teams'].values() for g in t['games']]
              return {field:sum(g.get(field) is not None for g in rows)//2 for field in ['market_moneyline','market_ou_total','market_starter','team_runline_side']}
          repo=json.load(open('data/mlb/game-results/2026.json'))
          print('REPOSITORY',count(repo))
          url='https://matchlab.parlaycalculator.bet/data/mlb/game-results/2026.json'
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'BetWise-2026-Season-Verify/1.0'})
              with urllib.request.urlopen(request,timeout=25) as response:online=json.load(response)
              print('LIVE',count(online))
              print('LIVE_ODDS_MATCH',count(repo)==count(online))
          except Exception as e:
              print('LIVE_FETCH_FAILED',repr(e))
          PY
      - name: Save report
        if: always()
        run: |
          mkdir -p data/mlb/audits
          cp /tmp/2026-live.txt data/mlb/audits/2026-live-workbook-status.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb/audits/2026-live-workbook-status.txt
          if ! git diff --cached --quiet; then git commit -m "Report live 2026 MLB odds publication";git push;fi
