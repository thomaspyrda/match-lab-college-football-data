name: Verify MLB live pipeline
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mlb-read-only-health
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python scripts/verify_sport_dataset_contract.py --sport mlb
        python verify_mlb_pipeline.py
