name: Build CFB Program Accolades
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cfb_program_accolades.py
      - apply_cfb_program_accolades.py
      - verify_cfb_team_pages.py
      - refresh_cfb_accolades.py
      - test_cfb_accolades.py
      - data/cfb/program-accolades.json
      - data/cfb/national-title-claims.json
      - .github/workflows/cfb-program-accolades.yml
permissions:
  contents: write
concurrency:
  group: cfb-program-accolades
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify program history and existing season calculations
        run: python -m unittest test_cfb_accolades.py test_cfb_team_pages.py
      - name: Build all CFB team pages from existing season data
        run: python apply_cfb_program_accolades.py
      - name: Verify all generated archives
        run: python verify_cfb_team_pages.py
      - name: Verify honors on every program page
        run: |
          python - <<'PY'
          import json
          from build_cfb_team_pages import ROOT,slug
          teams=json.loads((ROOT/'data/cfb/team-registry.json').read_text())['teams']
          for t in teams:
              s=(ROOT/'cfb/teams'/slug(t['name'])/'index.html').read_text()
              assert s.count('id="programAccolades"')==1,t['name']
              assert s.index('id="programAccolades"')>s.index('id="schedule"'),t['name']
          print('Verified Program Accolades on all',len(teams),'team pages')
          PY
      - name: Publish team pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/teams data/cfb/teams teams.html sitemap-cfb-teams.xml sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Add sourced program accolades to every CFB team page"
          git pull --rebase -X theirs origin main
          git push origin main
